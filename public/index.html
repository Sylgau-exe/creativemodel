<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Creative Export Engine</title>
<!-- board v14 — 2026-09-21: why-a-new-mechanism opener, 'Why not EDC?' comparison, by-sector table, loan-not-equity wording -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --ink:#0B1826; --ink-2:#12283C; --ink-3:#1A3A55; --line:#2B4C69;
    --ivory:#F3EDE2; --muted:#9FB3C4; --dim:#6B8194;
    --gold:#E3A63B; --gold-2:#F5C96B; --teal:#4FB8AD; --teal-2:#8BD9D0;
    --display:"Fraunces",Georgia,"Times New Roman",serif;
    --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
    --ease:cubic-bezier(.22,.9,.26,1);
    color-scheme:dark;
  }
  html,body{height:100%}
  body{margin:0;background:var(--ink);color:var(--ivory);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden}
  .app{position:relative;height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:0 12px;overflow:hidden}
  .spot{position:fixed;inset:-20%;pointer-events:none;z-index:0;background:
    radial-gradient(700px 700px at var(--mx,50%) var(--my,30%), rgba(227,166,59,.14), transparent 60%),
    radial-gradient(900px 700px at 100% 100%, rgba(79,184,173,.10), transparent 60%);transition:background-position .2s}
  header{position:relative;z-index:3;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px 8px}
  .brand h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,2.8vw,34px);line-height:1.05;margin:0;letter-spacing:-.01em}
  .brand p{margin:4px 0 0;color:var(--muted);max-width:64ch;font-size:14px}
  .brand .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
  .controls{display:flex;gap:10px;align-items:center}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--ink-2)}
  .lang button{background:none;border:0;color:var(--muted);font:600 12px/1 var(--body);letter-spacing:.08em;padding:9px 14px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
  button:focus-visible,.node:focus-visible,.tile:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}

  /* ---------- camera & world ---------- */
  .viewport{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:18px}
  .world{position:absolute;left:0;top:0;width:1200px;height:760px;transform-origin:0 0;transition:transform 1.1s var(--ease),filter .6s ease;will-change:transform}
  .world.away{filter:blur(2px) saturate(.7)}
  .flows{position:absolute;inset:0;width:1200px;height:760px;overflow:visible}
  .flow{fill:none;stroke-width:1.7;stroke-linecap:round;transition:opacity .5s}
  .flow.pub{stroke:var(--gold);stroke-dasharray:6 7}
  .flow.priv{stroke:var(--teal);stroke-dasharray:6 7}
  .flow.gov{stroke:rgba(243,237,226,.55);stroke-dasharray:2 7}
  .flow.anim{animation:dash 14s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-260}}
  .flabel{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
  .flabel.pub{fill:var(--gold-2)} .flabel.priv{fill:var(--teal-2)}
  .flabel-bg{fill:var(--ink);opacity:.92}
  .world.away .flow,.world.away .flabel,.world.away .flabel-bg,.world.away .dot{opacity:.25}
  /* particles */
  .dot{r:3;opacity:.9;transition:opacity .4s}
  .dot.pub{fill:var(--gold-2);filter:drop-shadow(0 0 4px rgba(245,201,107,.9))}
  .dot.priv{fill:var(--teal-2);filter:drop-shadow(0 0 4px rgba(139,217,208,.9))}
  .dot.gov{fill:var(--ivory);opacity:.7;filter:drop-shadow(0 0 3px rgba(243,237,226,.7))}
  /* highlight mode: hover or tour */
  .flows.hl .flow,.flows.hl .flabel,.flows.hl .flabel-bg,.flows.hl .dot{opacity:.12}
  .flows.hl .flow.lit{opacity:1;stroke-width:2.6}
  .flows.hl .flabel.lit,.flows.hl .flabel-bg.lit{opacity:1}
  .flows.hl .dot.lit{opacity:1;r:4.2}
  .world.tour .node{opacity:.45}
  .world.tour .node.focus{opacity:1;transform:scale(1.05);border-color:var(--gold-2);box-shadow:0 0 0 1px rgba(245,201,107,.5),0 0 50px rgba(227,166,59,.45),0 24px 60px rgba(0,0,0,.5)}
  .world.tour .node.focus.private{border-color:var(--teal-2);box-shadow:0 0 0 1px rgba(139,217,208,.5),0 0 50px rgba(79,184,173,.45),0 24px 60px rgba(0,0,0,.5)}
  /* load choreography */
  .node.enter{animation:nodeIn .7s var(--ease) both}
  @keyframes nodeIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
  .flows.enter .flow,.flows.enter .flabel,.flows.enter .flabel-bg,.flows.enter .dot{animation:fadeIn 1s ease-out .9s both}
  .flows.enter .flow.anim{animation:fadeIn 1s ease-out .9s both,dash 14s linear infinite}
  @keyframes fadeIn{from{opacity:0}}


  /* ---------- Q&A ---------- */
  .qabtn{height:38px}
  .qabtn.on{border-color:var(--gold);color:var(--gold-2)}
  .qa{position:absolute;inset:8px;z-index:11;box-sizing:border-box;border-radius:22px;background:linear-gradient(165deg,#1B3D5A,#102539);border:1px solid rgba(227,166,59,.55);
    box-shadow:0 40px 100px rgba(0,0,0,.6);overflow:hidden;display:flex;flex-direction:column;animation:qaIn .5s var(--ease) both}
  @keyframes qaIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
  .qa[hidden]{display:none}
  .qainner{display:flex;flex-direction:column;height:100%;min-height:0}
  .qahead{display:flex;align-items:flex-start;gap:14px;padding:22px 26px 10px}
  .qahead h2{font-family:var(--display);font-weight:700;font-size:clamp(22px,2.6vw,30px);line-height:1.05;margin:0}
  .qahead p{margin:6px 0 0;color:var(--muted);font-size:13.5px;max-width:70ch}
  .qahead .count{font-family:var(--mono);font-size:12px;color:var(--gold-2);margin-top:8px}
  .qatools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:6px 26px 12px}
  .qatools input{flex:1 1 240px;min-width:200px;height:36px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ivory);padding:0 14px;font:14px var(--body);outline:none}
  .qatools input:focus{border-color:var(--gold-2)}
  .qatools input::placeholder{color:var(--dim)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 26px 10px}
  .chip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 11px;font:500 12px/1 var(--body);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
  .chip.gap[aria-pressed="true"]{background:var(--gold-2)}
  .chip:hover{border-color:var(--gold-2);color:var(--ivory)} .chip[aria-pressed="true"]:hover{color:var(--ink)}
  .qalist{flex:1;min-height:0;overflow:auto;padding:0 26px 24px;display:flex;flex-direction:column;gap:8px}
  .qi{flex:none;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.04);overflow:hidden}
  .qi.open{border-color:rgba(227,166,59,.45);background:rgba(255,255,255,.06)}
  .qi .qq{width:100%;text-align:left;background:none;border:0;color:var(--ivory);cursor:pointer;padding:13px 16px;display:flex;gap:12px;align-items:flex-start;font:500 15px/1.35 var(--body)}
  .qi .qq .who{flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-top:3px;width:150px}
  .qi .qq .txt{flex:1}
  .qi .qq .badge{flex:none;font:600 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:var(--ink);border-radius:999px;padding:5px 8px;margin-top:2px}
  .qi .qq .car{flex:none;color:var(--dim);transition:transform .3s;margin-top:2px}
  .qi.open .qq .car{transform:rotate(90deg);color:var(--gold-2)}
  .qi .qa-a{display:none;padding:0 16px 16px 178px;color:#DDE5EC;font-size:14.5px;line-height:1.55}
  .qi.open .qa-a{display:block;animation:capIn .35s var(--ease) both}
  .qi .qa-a .gapnote{margin-top:10px;border-left:3px solid var(--gold);background:rgba(227,166,59,.1);padding:8px 12px;border-radius:0 10px 10px 0;font-size:13.5px}
  .qi .qa-a .gapnote b{color:var(--gold-2);font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:3px}
  .qaempty{color:var(--muted);padding:20px 4px}
  @media (max-width:760px){ .qa{inset:4px} .qahead,.qatools,.chips,.qalist{padding-inline:14px} .qi .qq .who{display:none} .qi .qa-a{padding-left:16px} .qi .qq{font-size:14px} }


  /* ---------- snapshot (linear one-pager) ---------- */
  .snap{border-color:rgba(227,166,59,.7)}
  .snapbody{flex:1;min-height:0;overflow:auto;padding:0 26px 26px;scroll-behavior:smooth}
  .snapgrid{display:grid;gap:14px;max-width:980px}
  .sec{border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.04);padding:16px 18px 14px;display:grid;grid-template-columns:34px 1fr;gap:6px 14px;align-items:start}
  .sec .n{width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--ink);font:600 13px/28px var(--mono);text-align:center;grid-column:1;grid-row:1}
  .sec>*:not(.n){grid-column:2}
  .sec h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,2vw,22px);line-height:1.1;margin:2px 0 4px;text-wrap:balance}
  .sec p{margin:0 0 8px;color:#DDE5EC;font-size:14.5px;line-height:1.55;max-width:78ch}
  .sec p:last-child{margin-bottom:0}
  .sec .big{font-family:var(--display);font-weight:600;font-size:clamp(19px,2.2vw,26px);line-height:1.15;color:var(--gold-2);margin:2px 0 8px}
  .sec ul{margin:0 0 6px;padding-left:18px;color:#DDE5EC;font-size:14.5px}
  .sec li{margin:0 0 6px} .sec li b{color:var(--ivory)}
  .sec .pieces{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:4px 0 6px}
  .sec .piece{background:rgba(0,0,0,.22);border-radius:12px;padding:12px 14px;border-top:3px solid var(--gold)}
  .sec .piece.priv{border-top-color:var(--teal)} .sec .piece.gov{border-top-color:rgba(243,237,226,.6)}
  .sec .piece b{display:block;font-family:var(--display);font-size:15.5px;margin-bottom:4px}
  .sec .piece span{font-size:13px;color:#DDE5EC;line-height:1.45}
  .loop{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 10px;font-family:var(--mono);font-size:12px}
  .loop span{border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--ivory);background:rgba(0,0,0,.2)}
  .loop span.priv{border-color:var(--teal);color:var(--teal-2)} .loop span.pub{border-color:var(--gold);color:var(--gold-2)}
  .loop i{color:var(--dim);font-style:normal}
  .sec .risks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:4px 0 2px}
  .sec .risks div{background:rgba(0,0,0,.22);border-radius:12px;padding:11px 13px;font-size:13.5px;color:#DDE5EC;line-height:1.45}
  .sec .risks b{display:block;font:500 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-2);margin-bottom:4px}
  .sec .tbl{margin:6px 0 4px}
  .sec .tbl td{font-size:13px}
  .sec .tbl.cmp th:first-child,.sec .tbl.cmp td:first-child{color:var(--muted);font-size:12px;width:120px}
  .sec .tbl.cmp td.us{color:var(--ivory);background:rgba(227,166,59,.08)} .sec .tbl.cmp th.us{color:var(--gold-2)}
  .sec .qs{display:grid;gap:8px;margin:2px 0 6px}
  .sec .q{background:rgba(0,0,0,.22);border-radius:12px;padding:11px 14px}
  .sec .q b{display:block;font-family:var(--display);font-size:15.5px;color:var(--gold-2);margin-bottom:3px}
  .sec .q span{font-size:14px;color:#DDE5EC;line-height:1.5}
  .snapcta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:6px 0 2px}
  .snapcta .ibtn.primary{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}
  .snapcta .ibtn.primary:hover{background:var(--gold-2)}
  .snapfoot{color:var(--muted);font-size:12.5px;margin-top:8px}
  .snapbtn.on{border-color:var(--gold);color:var(--gold-2)}
  @media (max-width:760px){ .snapbody{padding-inline:14px} .sec{grid-template-columns:1fr;padding:14px} .sec .n{display:none} .controls{flex-wrap:wrap;gap:6px} .qabtn{height:34px;padding:0 11px} }

  /* ---------- portfolio ---------- */
  .pfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:0 26px 24px;overflow:auto;flex:1;min-height:0;align-content:start}
  .pfcard{position:relative;text-align:left;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.05);padding:16px 16px 14px;color:var(--ivory);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .3s var(--ease),border-color .3s,background .3s}
  .pfcard:hover{transform:translateY(-3px);border-color:rgba(227,166,59,.6);background:rgba(255,255,255,.08)}
  .pfcard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{font:600 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:5px 8px;border:1px solid var(--line);color:var(--muted)}
  .pill.push{border-color:var(--gold);color:var(--gold-2)} .pill.pull{border-color:var(--teal);color:var(--teal-2)}
  .pill.draft{background:rgba(227,166,59,.18);border-color:transparent;color:var(--gold-2)}
  .pill.ok{border-color:var(--teal);color:var(--teal-2)} .pill.no{border-color:var(--dim);color:var(--muted)}
  .pfcard h3{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.15;margin:2px 0 0;text-wrap:balance}
  .pfcard .meta{font-size:12.5px;color:var(--muted);line-height:1.4}
  .pfcard .sig{font-size:13px;color:#DDE5EC;margin-top:2px}
  .pfcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;font-family:var(--mono);font-size:11px;color:var(--gold-2)}
  .pfcard .foot .stg{color:var(--muted)}
  .pfstats{display:flex;gap:10px;flex-wrap:wrap;padding:0 26px 14px}
  .pfstats div{background:rgba(0,0,0,.22);border-radius:12px;padding:10px 14px;min-width:120px}
  .pfstats b{display:block;font-family:var(--mono);font-weight:500;font-size:20px;color:var(--gold-2)}
  .pfstats small{color:var(--muted);font-size:11.5px}
  .sheet{flex:1;min-height:0;overflow:auto;padding:0 26px 26px}
  .sheet .shead2{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
  .sheet h2{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.4vw,28px);line-height:1.1;margin:6px 0 4px;text-wrap:balance}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;margin:10px 0 18px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.22)}
  .facts div{font-size:13px;color:#DDE5EC} .facts b{display:block;font:500 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
  .pipe{counter-reset:s;list-style:none;padding:0;margin:0 0 16px;display:grid;gap:10px}
  .pipe li{position:relative;padding:12px 14px 12px 50px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);color:#DDE5EC;font-size:14px;line-height:1.5}
  .pipe li::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:13px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);font:600 12px/24px var(--mono);text-align:center}
  .pipe li b{display:block;font-family:var(--display);font-size:15px;color:var(--ivory);margin-bottom:3px}
  .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:6px 0 4px}
  .grid4 div{background:rgba(0,0,0,.22);border-radius:10px;padding:10px 12px}
  .grid4 small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
  .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
  .grid4 b{font-family:var(--mono);font-weight:500;font-size:16px;color:var(--gold-2);display:block;margin-top:6px}
  .pfnote{border-left:3px solid var(--teal);background:rgba(79,184,173,.08);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;color:#DDE5EC;font-size:14px}
  .pfnote.gold{border-color:var(--gold);background:rgba(227,166,59,.08)}
  .pfnote b{display:block;font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-2);margin-bottom:4px}


  .vis{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:0 0 6px}
  .vis figure{margin:0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;cursor:zoom-in}
  .vis img{display:block;width:100%;height:170px;object-fit:cover;background:#fff}
  .vis figcaption{font-size:12px;color:var(--muted);padding:8px 10px;line-height:1.35}
  .lightbox{position:fixed;inset:0;z-index:50;background:rgba(5,12,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:zoom-out;padding:24px}
  .lightbox img{max-width:min(96vw,1100px);max-height:80vh;border-radius:10px;background:#fff}
  .lightbox p{margin:0;color:var(--ivory);font-size:14px;text-align:center;max-width:70ch}
  .tc{color:var(--gold-2);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
  .blk{margin:14px 0 6px}
  .blk h3{font-family:var(--display);font-weight:700;font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:10px}
  .blk h3 .n{width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);font:600 12px/24px var(--mono);text-align:center;flex:none}
  .blk .facts{margin:0 0 6px}
  .stages{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0 4px}
  .stages span{font:500 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:6px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .stages span.done{border-color:rgba(227,166,59,.5);color:var(--gold-2)} .stages span.cur{background:var(--gold);color:var(--ink);border-color:var(--gold)}
  .iptbl td{font-size:12.5px} .iptbl tr.na td{color:var(--dim)}
  .grid4 .rat{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.35}
  @media (max-width:760px){ .pfgrid,.pfstats,.sheet{padding-inline:14px} .pipe li{padding-left:44px} }

  /* ---------- guided tour ---------- */
  .tourbtn{background:var(--gold);border:0;color:var(--ink);height:38px;padding:0 16px;border-radius:999px;cursor:pointer;font:600 13px/1 var(--body);letter-spacing:.02em;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(227,166,59,.3);transition:transform .25s var(--ease),box-shadow .25s}
  .tourbtn:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(227,166,59,.45)}
  .tourbtn.on{background:rgba(255,255,255,.08);color:var(--ivory);border:1px solid var(--line);box-shadow:none}

        [B("Format / contract rights","Format / droits contractuels"),B("Rights defined by the contract itself","Les droits définis par le contrat"),B("Territory, window, per-unit royalty, brand editions","Territoire, fenêtre, royauté par unité, éditions de marque")]]),
      NOTE("The same map applies to a show (the format, the characters, the music, the staging technology), a game (engine, characters, world) or a series (format, chain of title). The Sage's question is always the same: which layer can a Canadian company keep, and what is it worth on its own?","La même carte s'applique à un spectacle (le format, les personnages, la musique, la technologie de scène), à un jeu (moteur, personnages, univers) ou à une série (format, chaîne de titres). La question du Sage est toujours la même : quelle couche une entreprise canadienne peut-elle garder, et que vaut-elle seule?",true)]},
    {id:"gov", n:B("Why arm's length","Pourquoi à distance"), body:[
      P("Selection is made on commercial and cultural merit, insulated from political discretion. The Conseil protects public credibility as much as returns.","La sélection se fait sur le mérite commercial et culturel, à l'abri de la discrétion politique. Le Comité protège la crédibilité publique autant que les rendements.",true),
      P("Three roles, deliberately separated so that no single actor both picks projects and holds the public's money: the market chooses, the fund manager puts capital at risk, the Conseil validates.","Trois rôles volontairement séparés pour qu'aucun acteur ne choisisse les projets et ne détienne l'argent public à la fois : le marché choisit, le gestionnaire engage le capital, le Comité valide.")]}
   ]},
 { id:"outcomes", kind:"public", x:900,y:22,w:270,h:110,
   tag:B("Five-year benefits","Bénéfices sur cinq ans"), t:B("What five years look like","Cinq ans plus tard"), s:B("provincial-scale proof of concept","preuve de concept à l'échelle provinciale"), k:B("exports 3.5 → 5.5 G$","exportations 3,5 → 5,5 G$"),
   facets:[
    {id:"targets", n:B("Targets","Cibles"), body:[
      P("Illustrative targets of the provincial-scale model. Scaled federally, across all provinces and the full breadth of creative content, the figures would be commensurately larger.","Cibles illustratives du modèle à l'échelle provinciale. À l'échelle fédérale, toutes provinces et toute la largeur du contenu créatif confondues, les chiffres seraient d'autant plus grands."),
      STAT([{v:"3.5 → 5.5 G$",l:B("creative exports, +57%","exportations créatives, +57 %")},{v:"$800M",l:B("private capital deployed over 5 years","capital privé déployé sur 5 ans")},{v:"+40%",l:B("jobs, higher value-added","emplois, à plus forte valeur ajoutée")},{v:"30 → 45%",l:B("IP held by Canadian companies","PI détenue par des entreprises canadiennes")},{v:"$50M → ~$69M",l:B("reserve, self-financed","réserve, autofinancée")},{v:"→ $0",l:B("net cost of the reserve","coût net de la réserve")}])]},
    {id:"proof", n:B("Canadian proof","Preuves canadiennes"), body:[
      P("Canada's biggest creative export successes share one trait: a Canadian company kept the intellectual property.","Les plus grands succès d'exportation créative du Canada ont un point commun : une entreprise canadienne a conservé la propriété intellectuelle.",true),
      UL([B("PAW Patrol (Spin Master, Toronto): $15B+ in retail sales worldwide, 170+ countries, ~100,000 licensed products.","PAW Patrol (Spin Master, Toronto) : plus de 15 G$ de ventes au détail dans le monde, 170+ pays, ~100 000 produits sous licence."),
          B("Dead by Daylight (Behaviour, Montreal): 70M players; owning the IP took a 300–350-person work-for-hire studio to 1,260 employees.","Dead by Daylight (Behaviour, Montréal) : 70 M de joueurs; la propriété de la PI a fait passer un studio de services de 300–350 personnes à 1 260 employés."),
          B("Cirque du Soleil (Montreal): 100M+ spectators in 300+ cities. The touring shows it owns outright are the proof; its co-produced resident shows and brand extensions show how much harder it is when a third party holds the IP — which is exactly the contract moment the engine is built for.","Cirque du Soleil (Montréal) : plus de 100 M de spectateurs dans 300+ villes. Les spectacles de tournée qu'il détient en propre sont la preuve; ses spectacles résidents coproduits et ses extensions de marque montrent combien c'est plus difficile quand un tiers détient la PI — précisément le moment contractuel pour lequel le moteur est conçu.")]),
      NOTE("The counter-example: Quebec VFX and animation — world-class talent under service contracts on foreign-owned IP — went from 8,037 jobs in 2022 to 2,603 in 2024 when the work moved.","Le contre-exemple : les VFX et l'animation au Québec — un talent de classe mondiale sous contrats de services sur des PI étrangères — sont passés de 8 037 emplois en 2022 à 2 603 en 2024 quand le travail est parti.")]}
   ]},
 { id:"reserve", kind:"public", x:40,y:250,w:270,h:140,
   tag:B("Insurer","Assureur"), t:B("Sovereign insurance","Assurance souveraine"), s:B("capital-protection reserve","réserve de protection du capital"), k:B("$50M one-time seed → ~$69M","50 M$ une fois → ~69 M$"),
   facets:[
    {id:"how", n:B("How it works","Fonctionnement"), body:[
      P("The state never invests in projects. It partially protects private investors in qualified projects, and the premiums those investors pay grow the reserve. Sovereign reinsurance, not a grant.","L'État n'investit jamais dans les projets. Il protège partiellement les investisseurs privés dans des projets qualifiés, et les primes payées par ces investisseurs font croître la réserve. Une réassurance souveraine, pas une subvention.",true),
      STEPS([B("The producer's project pays the fund a premium according to its risk profile — 3 to 12% of capital deployed.","Le projet du producteur verse au fonds une prime selon son profil de risque — 3 à 12 % du capital déployé."),
             B("The fund splits the premium: roughly 60% feeds the investors' insured yield, roughly 40% is ceded to the sovereign reserve.","Le fonds répartit la prime : environ 60 % vers le rendement assuré des investisseurs, environ 40 % cédés à la réserve souveraine."),
             B("The investor earns an insured yield plus project upside.","L'investisseur obtient un rendement assuré plus la plus-value des projets."),
             B("The government remains the insurer, with a reserve that finances itself on premiums instead of freezing $50M indefinitely.","Le gouvernement demeure l'assureur, avec une réserve qui s'autofinance par les primes au lieu de figer 50 M$ indéfiniment."),
             B("As the reserve grows, insurance capacity grows — with no new public contribution.","À mesure que la réserve croît, la capacité d'assurance croît — sans nouvel apport public.")]),
      NOTE("R&D tax credits are not a source of the fund. They stay entirely with producers and are deducted from the capital request before scoring.","Les crédits d'impôt R&D ne sont pas une source du fonds. Ils restent intégralement aux producteurs et sont déduits de la demande de capital avant le scoring.")]},
    {id:"tiers", n:B("Risk tiers","Paliers de risque"), body:[
      P("Protection is risk-adjusted, never a blanket guarantee. Terminology: \"protected capital — risk-adjusted level\", aligned with the UK Growth Guarantee Scheme and the US Treasury AGP.","La protection est ajustée au risque, jamais une garantie générale. Terminologie : « capital protégé — niveau ajusté au risque », alignée sur le UK Growth Guarantee Scheme et l'AGP du Trésor américain."),
      TBL([B("Risk","Risque"),B("Premium","Prime"),B("Capital protected","Capital protégé"),B("Examples","Exemples")],[
        [B("Low","Faible"),{num:"3–5%"},{num:"100%"},B("Expansion of a proven immersive series; pre-sold TV series","Expansion d'une série immersive éprouvée; série télé prévendue")],
        [B("Medium","Moyen"),{num:"5–8%"},{num:"80%"},B("AA game; circus tour","Jeu AA; tournée de cirque")],
        [B("Higher","Élevé"),{num:"8–12%"},{num:"60%"},B("First game; innovative VR","Premier jeu; RV innovante")]]),
      STAT([{v:"~88%",l:B("weighted average cover on a balanced portfolio","couverture moyenne pondérée d'un portefeuille équilibré")}])]},
    {id:"traj", n:B("Five-year trajectory","Trajectoire sur cinq ans"), body:[
      P("Proof-of-concept model built on a $50M initial reserve.","Modèle de preuve de concept bâti sur une réserve initiale de 50 M$."),
      TBL([B("","" ),{num:"Y1"},{num:"Y2"},{num:"Y3"},{num:"Y4"},{num:"Y5"}],[
        [B("Private capital deployed (cumulative)","Capital privé déployé (cumulatif)"),{num:"$50M"},{num:"$150M"},{num:"$325M"},{num:"$550M"},{num:"$800M"}],
        [B("Premiums collected","Primes perçues"),{num:"$3M"},{num:"$6M"},{num:"$10.5M"},{num:"$13.5M"},{num:"$15M"}],
        [B("Sovereign reserve","Réserve souveraine"),{num:"$51.2M"},{num:"$53.6M"},{num:"$57.8M"},{num:"$63.2M"},{num:"~$69M"}]]),
      P("Over five years, $800M of private capital is deployed against $48M of cumulative premiums. Provided portfolio failure rates stay below the priced threshold, the net cost of the reserve trends toward zero.","Sur cinq ans, 800 M$ de capital privé sont déployés contre 48 M$ de primes cumulées. Tant que le taux d'échec du portefeuille reste sous le seuil tarifé, le coût net de la réserve tend vers zéro.")]},
    {id:"prec", n:B("Precedents","Précédents"), body:[
      P("Every model where the government plays insurer rather than investor has produced positive or neutral results for taxpayers and attractive returns for private investors.","Chaque modèle où le gouvernement joue le rôle d'assureur plutôt que d'investisseur a produit des résultats positifs ou neutres pour le contribuable et des rendements attrayants pour les investisseurs privés.",true),
      UL([B("Completion bonds in film production.","Les completion bonds en production cinématographique."),
          B("UK Growth Guarantee Scheme (British Business Bank).","Le UK Growth Guarantee Scheme (British Business Bank)."),
          B("US Treasury Asset Guarantee Program.","L'Asset Guarantee Program du Trésor américain."),
          B("Export Development Canada — self-sufficient export insurance, the Canadian federal precedent.","Exportation et développement Canada — assurance à l'exportation autosuffisante, le précédent fédéral canadien.")])]}
   ]},
 { id:"fund", kind:"private", x:440,y:250,w:320,h:140,
   tag:B("The private export fund","Le fonds privé d'exportation"), t:B("Protected capital fund","Fonds à capital protégé"), s:B("professionally managed · manager has skin in the game","géré par un professionnel · qui engage son propre argent"), k:B("deploys $250M+/yr — 100% private","déploie 250 M$+/an — 100 % privé"),
   facets:[
    {id:"structure", n:B("Structure","Structure"), body:[
      TBL([B("Parameter","Paramètre"),B("Detail","Détail")],[
        [B("Target capital","Capital cible"),B("$250M+ per year, 100% private","250 M$+ par année, 100 % privé")],
        [B("Manager","Gestionnaire"),B("Selected by public RFP; 2–5% co-investment (skin in the game)","Sélectionné par appel d'offres public; co-investissement de 2 à 5 % (engagement personnel)")],
        [B("Instruments","Instruments"),B("Participating loans, royalty-based financing, mezzanine debt — repaid in first position; the fund takes no shares in the company","Prêts participatifs, financement sur royautés, dette mezzanine — remboursés en première position; le fonds ne prend aucune action dans l'entreprise")],
        [B("Term","Durée"),B("Evergreen (semi-annual redemptions) or closed 7–10-year fund","Evergreen (rachats semestriels) ou fonds fermé de 7 à 10 ans")],
        [B("Protection model","Modèle de protection"),B("Sovereign reinsurance — capital protected by risk profile","Réassurance souveraine — capital protégé selon le profil de risque")],
        [B("IP condition","Condition PI"),B("Eligibility: the IP — or a lasting right to its revenues — stays in Canada (ownership, co-ownership, licence or royalty)","Admissibilité : la PI — ou un droit durable sur ses revenus — reste au Canada (propriété, copropriété, licence ou royauté)")],
        [B("Contract standard","Standard contractuel"),B("Financed producers commit to the Recoupment Standard","Les producteurs financés s'engagent au Standard de recoupment")]])]},
    {id:"returns", n:B("Investor return","Rendement investisseur"), body:[
      STAT([{v:"8–15%",l:B("target net IRR","TRI net cible")},{v:"~60%",l:B("of premiums → insured yield","des primes → rendement assuré")},{v:"~40%",l:B("of premiums → sovereign reserve","des primes → réserve souveraine")}],true),
      P("The investor gets an insured yield funded by premiums plus, where negotiated, a limited royalty participation on the projects — never shares in the company. The state's protection absorbs part of the downside, which is what draws institutional money into a sector it would otherwise avoid.","L'investisseur obtient un rendement assuré financé par les primes plus, si négociée, une participation limitée aux royautés des projets — jamais d'actions dans l'entreprise. La protection de l'État absorbe une partie du risque de perte, ce qui attire l'argent institutionnel vers un secteur qu'il éviterait autrement.",true),
      P("Sectors growing 12–25% a year; capital protected by the state; commercial discipline enforced by the Recoupment Standard.","Des secteurs en croissance de 12 à 25 % par année; un capital protégé par l'État; une discipline commerciale imposée par le Standard de recoupment.")]},
    {id:"flows", n:B("Money in, money out","Entrées et sorties"), body:[
      STEPS([B("Private investors commit capital to the fund.","Les investisseurs privés engagent du capital dans le fonds."),
             B("The fund finances qualified export projects — protected financing plus export advances.","Le fonds finance des projets d'exportation qualifiés — financement protégé et avances à l'exportation."),
             B("Projects pay premiums (3–12%); the fund splits them between insured yield and the sovereign reserve.","Les projets versent des primes (3 à 12 %); le fonds les répartit entre rendement assuré et réserve souveraine."),
             B("Export revenues flow back under the Recoupment Standard; the fund is repaid capital and yield in first position, then exits — the company keeps its IP and its equity.","Les revenus d'exportation reviennent sous le Standard de recoupment; le fonds est remboursé en capital et rendement en première position, puis se retire — l'entreprise garde sa PI et son capital-actions.")]),
      NOTE("The state never invests — it insures. Private capital invests, and the reserve grows on the premiums.","L'État n'investit jamais — il assure. Le privé investit, et la réserve croît au fil des primes.",true)]}
   ]},
 { id:"office", kind:"gov", x:890,y:250,w:280,h:140,
   tag:B("Strategist","Stratège"), t:B("Executive production office","Bureau de production exécutive"), s:B("40–50 experienced producers","40 à 50 producteurs d'expérience"), k:B("80–120 opportunities / year","80 à 120 occasions / an"),
   facets:[
    {id:"process", n:B("Processes","Processus"), body:[
      P("Producers, not administrators. Each office is led by a producer who has delivered projects abroad and can tell in ten minutes whether an opportunity is real.","Des producteurs, pas des diplomates. Chaque bureau est dirigé par un producteur qui a livré des projets à l'international et peut dire en dix minutes si une occasion est réelle.",true),
      NOTE("Order of operations: the office finds and qualifies → the Conseil des Sages validates in 48 hours → the fund manager decides. The office is the front door; nothing reaches the Conseil or the fund that the office has not qualified first.","Ordre des opérations : le bureau trouve et qualifie → le Comité des Sages valide en 48 h → le gestionnaire du fonds décide. Le bureau est la porte d'entrée; rien n'atteint le Comité ni le fonds sans avoir d'abord été qualifié par le bureau.",true),
      H("Five roles","Cinq rôles"),
      P("Scout → first filter (field qualification) → due diligence (verify the stakeholders) → connector (put the Canadian company in the room) → second-level validation by a Sage.","Éclaireur → premier filtre (qualification terrain) → due diligence (vérifier les parties prenantes) → connecteur (mettre l'entreprise en contact) → validation de second niveau par un Sage."),
      H("Six-step qualification pipeline","Pipeline de qualification en six étapes"),
      STEPS([B("Opportunity — signal received (embassy, trade mission, Sage, producer).","Occasion — signal reçu (ambassade, mission, Sage, producteur)."),
             B("Qualification — who, how serious, budget, timeline? Producer + Sage.","Qualification — qui, sérieux, budget, échéancier? Producteur + Sage."),
             B("Quantification — size, potential revenue, business model. Producer + Canadian company.","Quantification — taille, revenus potentiels, modèle d'affaires. Producteur + entreprise canadienne."),
             B("Summary — full file: risks, plan, cash-flow needs. Head office.","Sommaire — dossier complet : risques, plan, besoins de trésorerie. Siège."),
             B("Scoring — export, viability, IP, capacity. Eligibility committee.","Scoring — exportation, viabilité, PI, capacité. Comité d'admissibilité."),
             B("Decision — viable: Export Advance + protected fund; not viable: stop.","Décision — viable : Avance Export + fonds protégé; non viable : arrêt.")]),
      P("Same pipeline for PULL (the client approaches) and PUSH (we identify and approach).","Même pipeline en mode PULL (le client approche) et PUSH (on identifie et on approche).")]},
    {id:"locations", n:B("Locations","Bureaux"), body:[
      P("A small footprint in key markets, co-located with existing Canadian presence rather than built from scratch. In the federal version, offices can share space with Global Affairs Canada missions and the Trade Commissioner Service.","Une petite empreinte dans les marchés clés, en colocation avec la présence canadienne existante plutôt que bâtie de zéro. Dans la version fédérale, les bureaux peuvent partager les locaux des missions d'Affaires mondiales Canada et du Service des délégués commerciaux.",true),
      TBL([B("Office","Bureau"),B("Type","Type"),B("Sectors","Secteurs"),B("Markets","Marchés"),B("Goal","Objectif")],[
        [B("Los Angeles","Los Angeles"),B("Permanent","Permanent"),B("Games, VFX, live shows","Jeux, VFX, spectacles"),B("USA, Las Vegas, Hollywood","É.-U., Las Vegas, Hollywood"),B("Studios, publishers and Strip producers — the largest buyer market","Studios, éditeurs et producteurs du Strip — le plus grand marché acheteur")],
        [B("Paris / London","Paris / Londres"),B("Permanent","Permanent"),B("Circus, immersive, VFX, co-production","Cirque, immersif, VFX, coproduction"),B("Europe, North Africa","Europe, Afrique du Nord"),B("Public broadcasters, festivals, co-production treaties","Diffuseurs publics, festivals, traités de coproduction")],
        [B("Dubai / Abu Dhabi","Dubaï / Abou Dhabi"),B("Antenna","Antenne"),B("Mega-projects, immersive","Mégaprojets, immersif"),B("UAE, Saudi Arabia","ÉAU, Arabie saoudite"),B("Giga-project developers buying turnkey shows and experiences","Promoteurs de gigaprojets achetant spectacles et expériences clés en main")],
        [B("Singapore","Singapour"),B("Antenna","Antenne"),B("Immersive, games","Immersif, jeux"),B("Southeast Asia, Vietnam","Asie du Sud-Est, Vietnam"),B("Fast-growing venue and studio market","Marché des salles et des studios en forte croissance")],
        [B("Tokyo","Tokyo"),B("Antenna","Antenne"),B("Games, immersive","Jeux, immersif"),B("Japan, Korea, China","Japon, Corée, Chine"),B("Publishers and IP licensing partners","Éditeurs et partenaires de licence de PI")]]),
      NOTE("Offices are seeded for 24 months, then become self-supporting: producers monetize the deals they help close.","Les bureaux sont amorcés pendant 24 mois, puis deviennent autoportants : les producteurs monétisent les ententes qu'ils aident à conclure.")]},
    {id:"budget", n:B("Budget","Budget"), body:[
      P("Operating cost in the order of $30M a year in the proof-of-concept (Quebec-scale) model. Treat it as a ceiling: it can be optimized once we know which federal infrastructure abroad can be shared.","Coût de fonctionnement de l'ordre de 30 M$ par année dans le modèle de preuve de concept (échelle du Québec). À traiter comme un plafond : il peut être optimisé une fois connu ce qui peut être partagé avec l'infrastructure fédérale à l'étranger.",true),
      TBL([B("Line","Poste"),B("Annual","Annuel"),B("Share","Part")],[
        [B("Team and head office (40–50 professionals)","Équipe et siège social (40 à 50 professionnels)"),{num:"$7M"},{num:"23%"}],
        [B("International offices — experienced producers","Bureaux internationaux — producteurs d'expérience"),{num:"$6M"},{num:"20%"}],
        [B("Export Advance program","Programme Avance Export"),{num:"$6M"},{num:"20%"}],
        [B("Seed programs (prototypes, pre-revenue)","Programmes d'amorçage (prototypes, pré-revenus)"),{num:"$5M"},{num:"17%"}],
        [B("Market intelligence","Intelligence de marché"),{num:"$2M"},{num:"7%"}],
        [B("Conseil des Sages","Comité des Sages"),{num:"$1M"},{num:"3%"}],
        [B("VFX recovery (temporary, 3 years)","Redressement VFX (temporaire, 3 ans)"),{num:"$3M"},{num:"10%"}],
        [B("Total","Total"),{num:"$30M"},{num:"100%"}]]),
      NOTE("Plus a one-time $50M reserve — an actuarial provision that stays in the treasury and grows on premiums. Two different fiscal facts: the bureau is an operating cost; the reserve is insurance.","Plus une réserve unique de 50 M$ — une provision actuarielle qui reste dans les coffres et croît au fil des primes. Deux faits fiscaux distincts : le bureau est un coût de fonctionnement; la réserve est une assurance.",true)]},
    {id:"advance", n:B("Export Advance","Avance Export"), body:[
      P("The direct answer to \"time kills deals\". Once an opportunity is qualified, the company must develop the concept, travel and negotiate — all before any contract. The office advances that cash.","La réponse directe à « le temps tue les affaires ». Une fois l'occasion qualifiée, l'entreprise doit développer le concept, voyager et négocier — tout cela avant tout contrat. Le bureau avance cette trésorerie.",true),
      STAT([{v:"$25K–150K",l:B("per opportunity","par occasion")},{v:"$6M/yr",l:B("program budget — 40 to 80 opportunities","budget du programme — 40 à 80 occasions")},{v:"$0",l:B("risk for the SME","risque pour la PME")}]),
      UL([B("Repaid when the contract signs.","Remboursée à la signature du contrat."),
          B("Written off as an accepted loss if a positively qualified opportunity falls through.","Convertie en perte acceptée si une occasion qualifiée positivement tombe."),
          B("Qualification itself costs the company nothing — it is paid by the office's operating budget.","La qualification elle-même ne coûte rien à l'entreprise — elle est financée par le budget de fonctionnement du bureau.")])]}
   ]},
 { id:"investors", kind:"private", x:40,y:520,w:270,h:120,
   tag:B("Private capital","Capital privé"), t:B("Private investors","Investisseurs privés"), s:B("pension funds · institutions · family offices","caisses de retraite · institutions · family offices"), k:B("$250M+/yr · target IRR 8–15%","250 M$+/an · TRI cible 8 à 15 %"),

 { id:"producers", kind:"gov", x:440,y:520,w:320,h:130,
   tag:B("Creative content producers","Producteurs de contenu créatif"), t:B("Canadian SMEs","PME canadiennes"), s:B("film & TV co-production · games · touring shows · immersive · event tech","coproduction ciné/télé · jeux · tournées · immersif · techno événementielle"), k:B("condition: IP stays in Canada","condition : la PI reste au Canada"),
   facets:[
    {id:"who", n:B("Who qualifies","Qui est admissible"), body:[
      P("Commercial creative content built for international markets — not cultural content for a domestic audience, which existing programs already serve well.","Du contenu créatif commercial conçu pour les marchés internationaux — pas du contenu culturel pour un public national, que les programmes existants servent déjà bien.",true),
      H("The four-question test","Le test en quatre questions"),
      STEPS([B("Is the target audience mainly domestic? Yes → cultural.","Le public cible est-il surtout national? Oui → culturel."),
             B("Does the content carry national identity as its purpose? Yes → cultural.","Le contenu a-t-il l'identité nationale pour objet? Oui → culturel."),
             B("Does the model rely on export (over 50% of revenue)? Yes → commercial creative.","Le modèle repose-t-il sur l'exportation (plus de 50 % des revenus)? Oui → créatif commercial."),
             B("Sellable as-is in 10+ countries? Yes → commercial creative.","Vendable tel quel dans 10 pays et plus? Oui → créatif commercial.")]),
      P("Sectors: film and TV co-production, video games, touring live productions, immersive and experiential, audio and music, event technology.","Secteurs : coproduction cinéma et télé, jeux vidéo, productions en tournée, immersif et expérientiel, audio et musique, technologie événementielle.")]},
    {id:"journey", n:B("The journey","Le parcours"), body:[

    {id:"examples", n:B("What a project looks like","À quoi ressemble un projet"), body:[

        [B("A touring big-top show and a TV series sharing one story world","Un spectacle sous chapiteau en tournée et une série télé partageant un même univers"),B("PUSH","PUSH"),B("Full ownership by a Canadian holding; the series is bought by a streamer while the holding keeps the chain of title; the show runs under a royalty per performance","Propriété complète d'une société de portefeuille canadienne; la série est achetée par une plateforme, la société garde la chaîne de titres; le spectacle tourne sous royauté par représentation"),B("Export Advance for the concept and pilot; ~$24M protected private slice (medium tier, 80% cover) that has no natural home today","Avance Export pour le concept et le pilote; tranche privée protégée d'environ 24 M$ (palier moyen, couverture 80 %) qui n'a aucun financeur naturel aujourd'hui")],
        [B("A $10M feature film / limited series, Canada–Netherlands treaty co-production","Un long métrage / série limitée de 10 M$, coproduction officielle Canada–Pays-Bas"),B("PUSH","PUSH"),B("Shared IP between the Canadian and European producers","PI partagée entre les producteurs canadien et européen"),B("Advance for the script and recoupment structuring; ~$5M of private last money that nobody finances today because there is no recoupment standard","Avance pour le scénario et la structuration du recoupment; environ 5 M$ d'argent privé de dernière tranche que personne ne finance aujourd'hui, faute de standard de recoupment")],

        [B("A launch platform (projection, show control, performers) rented to foreign studios for premieres and fan events","Une plateforme de lancement (projection, régie, interprètes) louée aux studios étrangers pour premières et événements de fans"),B("PULL","PULL"),B("The studio keeps its title's IP; the Canadian company owns the platform and licenses each launch","Le studio garde la PI de son titre; l'entreprise canadienne détient la plateforme et licencie chaque lancement"),B("Higher tier until two reference launches; the customer's IP never has to move for the project to qualify","Palier plus risqué jusqu'à deux lancements de référence; la PI du client n'a pas à bouger pour que le projet soit admissible")],
        [B("Boundary case — a six-course training certificate developed for a foreign university and bought out","Cas limite — un certificat de six cours développé pour une université étrangère et racheté"),B("PULL","PULL"),B("Nothing flows back after the transfer","Rien ne revient après le transfert"),B("Office support and Export Advance only — no protected capital. This is what does not qualify.","Soutien du bureau et Avance Export seulement — pas de capital protégé. Voilà ce qui n'est pas admissible.")]]),
      H("The typical company","L'entreprise type"),
      P("Not the large groups, who already have in-house legal, financing and international sales — they are welcome but not the target. The engine exists for the company of 5 to 300 people that has exported once, owns or co-owns one property, and has a foreign buyer in discussion: it gives that company the qualification, the contract floor and the last money the large group already has.","Pas les grands groupes, qui ont déjà à l'interne le juridique, le financement et la vente internationale — ils sont bienvenus, mais pas la cible. Le moteur existe pour l'entreprise de 5 à 300 personnes qui a exporté une fois, détient ou codétient une propriété et a un acheteur étranger en discussion : il lui donne la qualification, le plancher contractuel et l'argent de dernière tranche que le grand groupe a déjà."),
      NOTE("Whole industry or specific projects? Every company in the sectors gets the office and the Export Advance, including pure service work. Protected capital goes only to projects where a recurring right stays in Canada — that is the point, not a restriction.","Toute l'industrie ou des projets précis? Toute entreprise des secteurs visés a droit au bureau et à l'Avance Export, y compris pour du pur service. Le capital protégé ne va qu'aux projets où un droit récurrent reste au Canada — c'est l'objectif, pas une restriction.",true)]},

        [B("How it starts","Comment ça commence"),B("Idea → script or concept → financing → production → distribution","Idée → scénario ou concept → financement → production → distribution"),B("Need → we answer the call (at our cost) → one vendor selected → contract → production → roll-out → acceptance","Besoin → on répond à l'appel (à nos frais) → un fournisseur retenu → contrat → production → déploiement → acceptation")],

    {id:"conditions", n:B("Conditions","Conditions"), body:[
      P("The IP stays in Canada.","La PI reste au Canada.",true),
      P("In full: eligibility for protected capital requires that a recurring Canadian revenue right survive the contract — ownership, co-ownership, licence, or a royalty on the work — and that the contract carry the Recoupment Standard. Pure buy-out work qualifies for the Export Advance and qualification support only.","En clair : l'admissibilité au capital protégé exige qu'un droit de revenu récurrent demeure au Canada après le contrat — propriété, copropriété, licence ou royauté sur l'œuvre — et que le contrat porte le Standard de recoupment. Le travail en rachat complet n'a droit qu'à l'Avance Export et au soutien à la qualification."),
      UL([B("The IP — or a lasting right to its revenues — retained by the Canadian company: the eligibility condition that turns cultural policy from subsidy into asset-building.","La PI — ou un droit durable sur ses revenus — conservée par l'entreprise canadienne : la condition d'admissibilité qui transforme la politique culturelle de subvention en constitution d'actifs."),
          B("Adoption of the published Recoupment Standard in every international contract.","Adoption du Standard de recoupment publié dans chaque contrat international."),

      P("Before: $100,000 lost on a false opportunity. Now: a producer qualifies, a Sage validates, the Export Advance finances, the Standard protects the contract.","Avant : 100 000 $ perdus sur une fausse occasion. Maintenant : un producteur qualifie, un Sage valide, l'Avance Export finance, le Standard protège le contrat.")]},

 { id:"standard", kind:"gov", x:470,y:686,w:260,h:52, small:true,
   tag:B("",""), t:B("Recoupment Standard","Standard de recoupment"), s:B("10 clauses — no \"Hollywood accounting\"","10 clauses — pas de « comptabilité hollywoodienne »"), k:B("",""),
   facets:[
    {id:"why", n:B("Why it exists","Pourquoi"), body:[
      P("The American film industry has spent seventy years perfecting accounting that makes profits vanish on paper. Forrest Gump ($677M worldwide) long sat as a loss in the studio's books; Return of the Jedi was still \"losing\" money twenty years after release.","L'industrie du cinéma américain a perfectionné pendant soixante-dix ans une comptabilité qui fait disparaître les profits sur papier. Forrest Gump (677 M$ US dans le monde) a longtemps figuré comme un échec dans les livres du studio; Le Retour du Jedi « perdait » encore de l'argent vingt ans après sa sortie.",true),
      P("For Canadian SMEs signing with global distributors and platforms, the contractual asymmetry is massive. The Standard turns the asymmetry each SME faces alone into a collective Canadian advantage — a guild floor. It also materially lowers the risk carried by the reserve.","Pour les PME canadiennes qui signent avec des distributeurs et des plateformes mondiales, l'asymétrie contractuelle est massive. Le Standard transforme l'asymétrie que chaque PME affronte seule en avantage canadien collectif — un plancher de guilde. Il réduit aussi sensiblement le risque porté par la réserve."),
      P("Codified from the hard-won experience of Canadian producers in the United States, Asia, the Middle East and Latin America.","Codifié à partir de l'expérience durement acquise de producteurs canadiens aux États-Unis, en Asie, au Moyen-Orient et en Amérique latine.")]},
    {id:"clauses", n:B("The 10 clauses","Les 10 clauses"), body:[
      STEPS([B("Strict definition of Gross Receipts — gross minus only third-party sales taxes, capped distribution fees and pre-defined, capped commercial rebates. No overhead, no corporate allocations.","Définition stricte des recettes brutes — brut moins seulement les taxes de vente tierces, les frais de distribution plafonnés et des remises commerciales prédéfinies et plafonnées. Pas d'overhead, pas d'allocations corporatives."),
             B("Caps on distribution fees — theatrical 20%, TV 15%, digital 10%, home video 25%; live shows negotiated per channel.","Plafonds aux frais de distribution — salle 20 %, télé 15 %, numérique 10 %, vidéo domestique 25 %; spectacles négociés par canal."),
             B("Affiliated transactions documented at market price, with the right to compare to third-party deals.","Transactions affiliées documentées au prix du marché, avec droit de comparaison à des transactions tierces."),
             B("Full audit rights — quarterly reports, annual independent audit, audit cost shifted to the distributor above a 5% discrepancy.","Droits d'audit complets — rapports trimestriels, audit annuel indépendant, coût de l'audit au distributeur au-delà d'un écart de 5 %."),
             B("No cross-collateralization — project-by-project accounting, never consolidated with the distributor's other losses.","Interdiction de la cross-collateralization — comptabilité projet par projet, jamais consolidée avec les autres pertes du distributeur."),
             B("Most Favoured Nation — better terms granted to any other rights-holder apply automatically.","Nation la plus favorisée — des termes plus favorables accordés à un autre titulaire s'appliquent automatiquement."),
             B("Granular reporting — territory by territory, window by window, platform by platform.","Granularité des rapports — territoire par territoire, fenêtre par fenêtre, plateforme par plateforme."),
             B("Caps on reserves — limited in amount and duration; automatic release after 18 months.","Plafonds de réserves — limitées en montant et en durée; libération automatique après 18 mois."),
             B("Pre-approval of sub-agents — the whole sub-distribution chain approved by the producer, with cascade margins disclosed.","Pré-approbation des sous-agents — toute la chaîne de sous-distribution approuvée par le producteur, marges en cascade divulguées."),
             B("No studio-defined \"Net Profits\" — sharing from Adjusted Gross Receipts, with an explicit, auditable formula.","Aucune définition « Net Profits » du studio — partage à partir des recettes brutes ajustées, formule explicite et auditable.")])]},
    {id:"modes", n:B("Four failure modes","Quatre modes de défaillance"), body:[
      TBL([B("Mode","Mode"),B("Mechanism","Mécanisme"),B("Protection","Protection")],[
        [B("Adversarial extraction","Extraction adversariale"),B("Studio engineers \"net profits\" to zero via overhead, affiliate fees, cross-collateralization","Le studio ramène les « profits nets » à zéro par overhead, frais affiliés, cross-collateralization"),B("The 10 accounting clauses","Les 10 clauses comptables")],
        [B("Operational discretion","Discrétion opérationnelle"),B("Local operator has one lever (discounts) with no cap or alert","L'opérateur local n'a qu'un levier (rabais) sans plafond ni signal d'alerte"),B("Commercial guardrails","Garde-fous commerciaux")],
        [B("Single-lever incentives","Incitation à levier unique"),B("Local manager's KPIs force one action — typically the discount","Les KPI du gestionnaire local imposent une seule action — typiquement le rabais"),B("KPI framing","Encadrement des KPI")],
        [B("Accounting classification","Classification comptable"),B("Discounts booked as expense rather than contra-revenue","Rabais classés en dépense plutôt qu'en contra-revenu"),B("Reporting structure","Structure de reporting")]])]}
