const QA = [{"g":"pch","c":"policy","q":{"en":"Is this a claim on the June 3, 2026 commitment?","fr":"Est-ce une demande sur l'engagement du 3 juin 2026?"},"a":{"en":"No. The engine is a layer on top of what exists, not a competing claim. Its operating cost is in the order of $30M a year in the proof-of-concept model, treated as a ceiling that can be optimized by sharing federal infrastructure abroad. How to fund it is the government's decision. The $250M+ a year is private capital and adds nothing to public spending.","fr":"Non. Le moteur est une couche ajoutée à ce qui existe, pas une demande concurrente. Son coût de fonctionnement est de l'ordre de 30 M$ par année dans le modèle de preuve de concept, traité comme un plafond optimisable en partageant l'infrastructure fédérale à l'étranger. Le mode de financement relève du gouvernement. Les 250 M$+ par année sont du capital privé et n'ajoutent rien aux dépenses publiques."}},{"g":"pch","c":"policy","q":{"en":"What does it do that the June 3 investment doesn't already do?","fr":"Que fait-il que l'investissement du 3 juin ne fait pas déjà?"},"a":{"en":"The June 3 commitment stabilizes production at home. Capacity is not Canada's problem. No federal instrument converts that capacity into export revenue and Canadian-held IP: nobody qualifies international opportunities in-market, advances the cash between qualification and contract, or brings protected capital to develop and hold a franchise. That is the gap the engine fills.","fr":"L'engagement du 3 juin stabilise la production au pays. La capacité n'est pas le problème du Canada. Aucun instrument fédéral ne convertit cette capacité en revenus d'exportation et en PI canadienne : personne ne qualifie les occasions sur le terrain, n'avance la trésorerie entre la qualification et le contrat, ni n'apporte du capital protégé pour développer et détenir une franchise. C'est ce vide que le moteur comble."}},{"g":"pch","c":"office","q":{"en":"How is it different from existing export support (Creative Export Canada, trade missions)?","fr":"En quoi diffère-t-il du soutien à l'exportation existant (Exportation créative Canada, missions commerciales)?"},"a":{"en":"Existing programs fund attendance and marketing: a booth, a trip, a market. The engine puts experienced producers in the market to qualify a lead in 48 hours instead of 3 months, advances $25K–150K so the company can develop the concept and negotiate before any contract, and connects the deal to protected private capital. Grants help you show up; the engine helps you close and keep the IP.","fr":"Les programmes existants financent la présence et le marketing : un kiosque, un voyage, un marché. Le moteur place des producteurs d'expérience sur le terrain pour qualifier une occasion en 48 h au lieu de 3 mois, avance de 25 à 150 K$ pour développer le concept et négocier avant tout contrat, et relie l'entente à du capital privé protégé. Les subventions aident à être présent; le moteur aide à conclure et à garder la PI."}},{"g":"pch","c":"producers","q":{"en":"Why say 'creative content' instead of 'audiovisual'?","fr":"Pourquoi dire « contenu créatif » plutôt qu'« audiovisuel »?"},"a":{"en":"Because live shows, immersive experiences and event technology are among Canada's strongest export performers and are usually left out of audiovisual frameworks. Creative content covers film and TV co-production, games, touring productions, immersive, audio and music, and event technology.","fr":"Parce que les spectacles, les expériences immersives et la technologie événementielle comptent parmi les meilleures performances canadiennes à l'exportation et sont généralement exclus des cadres audiovisuels. Le contenu créatif couvre la coproduction ciné/télé, les jeux, les tournées, l'immersif, l'audio et la musique, et la technologie événementielle."}},{"g":"pch","c":"producers","q":{"en":"Is this cultural policy or industrial policy?","fr":"Est-ce une politique culturelle ou industrielle?"},"a":{"en":"Industrial. The four-question test separates the two: domestic audience or national identity as purpose means cultural, served by existing programs; export over 50% of revenue and sellable as-is in 10+ countries means commercial creative content, served by the engine. Cultural programs and tax credits stay exactly as they are.","fr":"Industrielle. Le test en quatre questions sépare les deux : public national ou identité nationale comme objet, c'est culturel, servi par les programmes existants; exportation supérieure à 50 % des revenus et vendable tel quel dans 10 pays et plus, c'est du contenu créatif commercial, servi par le moteur. Les programmes culturels et les crédits d'impôt restent intacts."}},{"g":"pch","c":"outcomes","q":{"en":"What are you actually asking for?","fr":"Que demandez-vous concrètement?"},"a":{"en":"Three things. A two-hour technical working session with the officials implementing the commitment, to walk through the reserve mechanics, the risk tiers and the Recoupment Standard. A re-run of the five-year model with departmental data across all provinces and the full breadth of creative content. And the scoping of a pilot: a first cohort of qualified export opportunities, with the Conseil profiles, the fund-manager mandate and the reserve size defined.","fr":"Trois choses. Une séance de travail technique de deux heures avec les fonctionnaires qui mettent en œuvre l'engagement, pour parcourir la mécanique de la réserve, les paliers de risque et le Standard de recoupment. Une nouvelle exécution du modèle sur cinq ans avec les données du ministère, toutes provinces et tout le contenu créatif confondus. Et le cadrage d'un projet pilote : une première cohorte d'occasions d'exportation qualifiées, avec les profils du Comité, le mandat du gestionnaire et la taille de la réserve définis."}},{"g":"pch","c":"office","q":{"en":"How does it serve official languages and all regions, not just Montreal?","fr":"Comment sert-il les langues officielles et toutes les régions, pas seulement Montréal?"},"a":{"en":"The proof-of-concept figures are Quebec-scale because that is where the model was built. The federal version operates across all provinces, in both official languages, through offices co-located with Canadian missions abroad; the Conseil profiles are drawn nationally.","fr":"Les chiffres de la preuve de concept sont à l'échelle du Québec parce que c'est là que le modèle a été bâti. La version fédérale opère dans toutes les provinces, dans les deux langues officielles, par des bureaux en colocation avec les missions canadiennes; les profils du Comité sont recrutés à l'échelle nationale."}},{"g":"fin","c":"reserve","q":{"en":"What is the real cost to the taxpayer?","fr":"Quel est le coût réel pour le contribuable?"},"a":{"en":"Two fiscal facts, stated separately. The bureau is an operating cost: about $30M a year in the proof-of-concept model, a ceiling to be optimized. The reserve is insurance: a one-time $50M actuarial provision that stays in the treasury and grows on premiums, from $50M to about $69M by Year 5. Provided portfolio failure rates stay below the priced threshold, the net cost of the reserve trends to zero.","fr":"Deux faits fiscaux, énoncés séparément. Le bureau est un coût de fonctionnement : environ 30 M$ par année dans le modèle de preuve de concept, un plafond à optimiser. La réserve est une assurance : une provision actuarielle unique de 50 M$ qui reste dans les coffres et croît au fil des primes, de 50 M$ à environ 69 M$ en An 5. Tant que le taux d'échec du portefeuille reste sous le seuil tarifé, le coût net de la réserve tend vers zéro."}},{"g":"fin","c":"reserve","q":{"en":"What happens if failure rates exceed what the premiums price in?","fr":"Que se passe-t-il si les taux d'échec dépassent ce que les primes tarifent?"},"a":{"en":"The reserve pays claims up to what it holds; there is no open-ended guarantee. Protection is risk-adjusted, 100/80/60% by tier, about 88% weighted on a balanced portfolio, and insurance capacity only grows as the reserve grows. The Recoupment Standard materially lowers the risk carried. The equilibrium in the model holds if portfolio failure stays below roughly 15%.","fr":"La réserve paie les réclamations jusqu'à concurrence de ce qu'elle détient; il n'y a pas de garantie illimitée. La protection est ajustée au risque, 100/80/60 % selon le palier, environ 88 % en moyenne pondérée sur un portefeuille équilibré, et la capacité d'assurance ne croît qu'avec la réserve. Le Standard de recoupment réduit sensiblement le risque porté. L'équilibre du modèle tient si l'échec du portefeuille reste sous environ 15 %."}},{"g":"fin","c":"reserve","q":{"en":"Is the reserve a contingent liability on the government's books?","fr":"La réserve est-elle un passif éventuel dans les livres du gouvernement?"},"a":{"en":"It is structured as a provision, like Export Development Canada's self-sufficient export insurance, the federal precedent: capital held, premiums earned, claims paid from the reserve. The accounting treatment is for Finance to confirm; the model's point is that it is insurance, not spending.","fr":"Elle est structurée comme une provision, à l'image de l'assurance à l'exportation autosuffisante d'Exportation et développement Canada, le précédent fédéral : capital détenu, primes perçues, réclamations payées à même la réserve. Le traitement comptable revient à Finances; l'essentiel du modèle est qu'il s'agit d'une assurance, pas d'une dépense."}},{"g":"fin","c":"policy","q":{"en":"Why not simply expand tax credits?","fr":"Pourquoi ne pas simplement élargir les crédits d'impôt?"},"a":{"en":"Tax credits fund production capacity, which is not the problem; Canada already has it. They do nothing for ownership, market access or deal qualification, and they subsidize service work on foreign IP just as readily as Canadian franchises. The engine targets what tax credits cannot reach: the contract and the asset.","fr":"Les crédits d'impôt financent la capacité de production, qui n'est pas le problème; le Canada l'a déjà. Ils ne font rien pour la propriété, l'accès aux marchés ou la qualification des occasions, et ils subventionnent aussi bien le travail à forfait sur des PI étrangères que les franchises canadiennes. Le moteur vise ce que les crédits n'atteignent pas : le contrat et l'actif."}},{"g":"fin","c":"fund","q":{"en":"Is $250M a year of private capital realistic?","fr":"250 M$ par année de capital privé, est-ce réaliste?"},"a":{"en":"The model ramps: $50M deployed in Year 1, $150M cumulative in Year 2, $800M by Year 5. The sectors grow 12–25% a year, capital is protected 60–100% by tier, and the target net IRR is 8–15%. Every comparable scheme where the state insured rather than invested drew institutional money: completion bonds, the UK Growth Guarantee Scheme, the US Treasury Asset Guarantee Program.","fr":"Le modèle monte en puissance : 50 M$ déployés en An 1, 150 M$ cumulés en An 2, 800 M$ en An 5. Les secteurs croissent de 12 à 25 % par année, le capital est protégé de 60 à 100 % selon le palier, et le TRI net cible est de 8 à 15 %. Chaque modèle comparable où l'État a assuré plutôt qu'investi a attiré l'argent institutionnel : completion bonds, UK Growth Guarantee Scheme, Asset Guarantee Program du Trésor américain."}},{"g":"fin","c":"sages","q":{"en":"Isn't the government picking winners?","fr":"Le gouvernement ne choisit-il pas des gagnants?"},"a":{"en":"The government never picks a project and never invests in one. Three roles are deliberately separated: the market chooses, a professional fund manager with 2–5% of their own money allocates, and the Conseil des Sages validates. No single actor both picks projects and holds the public's money.","fr":"Le gouvernement ne choisit jamais un projet et n'y investit jamais. Trois rôles sont volontairement séparés : le marché choisit, un gestionnaire de fonds professionnel qui engage 2 à 5 % de son propre argent alloue, et le Comité des Sages valide. Aucun acteur ne choisit les projets et ne détient l'argent public à la fois."}},{"g":"fin","c":"reserve","q":{"en":"Why not do this through EDC or BDC?","fr":"Pourquoi ne pas passer par EDC ou la BDC?"},"a":{"en":"EDC insures receivables and political risk after a contract exists. The gap is before the contract, in development and qualification, and on the capital side, in holding the IP. EDC is the model's precedent and a natural administrator for the reserve; the engine is the missing front end.","fr":"EDC assure les créances et le risque politique une fois le contrat signé. Le vide se situe avant le contrat, dans le développement et la qualification, et du côté du capital, dans la détention de la PI. EDC est le précédent du modèle et un administrateur naturel de la réserve; le moteur est la porte d'entrée manquante."}},{"g":"agn","c":"policy","q":{"en":"Telefilm and the Canada Media Fund: does this compete with us?","fr":"Téléfilm et le Fonds des médias : est-ce en concurrence avec nous?"},"a":{"en":"No. Different content (commercial export, not cultural), different instrument (insurance and private capital, not grants) and different stage (qualifying international deals and holding IP, not financing domestic production). A producer can combine both: cultural support for the work, the engine for the export contract.","fr":"Non. Contenu différent (exportation commerciale, pas culturel), instrument différent (assurance et capital privé, pas subventions) et étape différente (qualifier des ententes internationales et détenir la PI, pas financer la production nationale). Un producteur peut combiner les deux : le soutien culturel pour l'œuvre, le moteur pour le contrat d'exportation."}},{"g":"agn","c":"office","q":{"en":"Trade Commissioner Service: aren't your offices duplicating ours?","fr":"Service des délégués commerciaux : vos bureaux ne font-ils pas double emploi?"},"a":{"en":"Producers, not diplomats. Trade commissioners open doors; the office is led by someone who has delivered projects abroad and can tell in ten minutes whether an opportunity is real, then qualifies, quantifies and puts the Canadian company in the room. In the federal version the offices share space with Global Affairs missions and the TCS, which is also how the $30M ceiling gets optimized.","fr":"Des producteurs, pas des diplomates. Les délégués commerciaux ouvrent des portes; le bureau est dirigé par quelqu'un qui a livré des projets à l'étranger et peut dire en dix minutes si une occasion est réelle, puis la qualifie, la quantifie et met l'entreprise canadienne en contact. Dans la version fédérale, les bureaux partagent les locaux des missions d'Affaires mondiales et du SDC, ce qui est aussi la façon d'optimiser le plafond de 30 M$."}},{"g":"agn","c":"reserve","q":{"en":"EDC: where does your protection stop and ours start?","fr":"EDC : où s'arrête votre protection et où commence la nôtre?"},"a":{"en":"The reserve protects the fund's capital in the project, by risk tier. EDC protects the exporter's receivables and covers political risk once the contract is signed. They stack rather than overlap, and a financed project would normally carry both.","fr":"La réserve protège le capital du fonds dans le projet, selon le palier de risque. EDC protège les créances de l'exportateur et couvre le risque politique une fois le contrat signé. Ils s'empilent plutôt qu'ils ne se chevauchent, et un projet financé porterait normalement les deux."}},{"g":"agn","c":"policy","q":{"en":"SODEC and provincial agencies: is this a federal intrusion?","fr":"SODEC et organismes provinciaux : est-ce une intrusion fédérale?"},"a":{"en":"The model was built as a Quebec proof of concept and can run at provincial scale. The federal version layers on top: the same producers, offices and reserve serve companies from every province, and provincial cultural agencies keep their mandate untouched.","fr":"Le modèle a été bâti comme preuve de concept québécoise et peut fonctionner à l'échelle provinciale. La version fédérale s'y superpose : les mêmes producteurs, bureaux et réserve servent les entreprises de toutes les provinces, et les organismes culturels provinciaux gardent leur mandat intact."}},{"g":"inv","c":"reserve","q":{"en":"What exactly is protected, capital or return?","fr":"Qu'est-ce qui est protégé au juste, le capital ou le rendement?"},"a":{"en":"Capital, by risk tier: 100% on low-risk projects (a pre-sold series, the expansion of a proven immersive show), 80% on medium (an AA game, a circus tour), 60% on higher risk (a first game, innovative VR). About 88% weighted on a balanced portfolio. The return comes from an insured yield funded by about 60% of the premiums, plus project upside.","fr":"Le capital, selon le palier de risque : 100 % sur les projets à faible risque (une série prévendue, l'expansion d'un spectacle immersif éprouvé), 80 % sur le risque moyen (un jeu AA, une tournée de cirque), 60 % sur le risque élevé (un premier jeu, de la RV innovante). Environ 88 % en moyenne pondérée. Le rendement vient d'un rendement assuré financé par environ 60 % des primes, plus la plus-value des projets."}},{"g":"inv","c":"fund","q":{"en":"Who pays the premium, and how much?","fr":"Qui paie la prime, et combien?"},"a":{"en":"The financed project pays it: 3–5% of capital deployed on low risk, 5–8% on medium, 8–12% on higher. The fund splits it, roughly 60% to the investors' insured yield and 40% ceded to the sovereign reserve.","fr":"Le projet financé la paie : 3 à 5 % du capital déployé à faible risque, 5 à 8 % au risque moyen, 8 à 12 % au risque élevé. Le fonds la répartit, environ 60 % vers le rendement assuré des investisseurs et 40 % cédés à la réserve souveraine."}},{"g":"inv","c":"fund","q":{"en":"How is an 8–15% net IRR credible in this sector?","fr":"Comment un TRI net de 8 à 15 % est-il crédible dans ce secteur?"},"a":{"en":"Three things stack: sectors growing 12–25% a year, a floor set by the insured yield and the protected capital, and commercial discipline imposed by the Recoupment Standard so that revenue actually reaches the investor instead of disappearing in distribution accounting. The upside comes from royalties, licences and equity on Canadian-held IP.","fr":"Trois éléments s'additionnent : des secteurs en croissance de 12 à 25 % par année, un plancher fixé par le rendement assuré et le capital protégé, et une discipline commerciale imposée par le Standard de recoupment pour que les revenus parviennent réellement à l'investisseur au lieu de disparaître dans la comptabilité de distribution. La plus-value vient des royautés, licences et participations sur des PI canadiennes."}},{"g":"inv","c":"fund","q":{"en":"What is the fund's term and liquidity?","fr":"Quelle est la durée du fonds et sa liquidité?"},"a":{"en":"Either an evergreen structure with semi-annual redemptions or a closed fund of 7 to 10 years. Instruments are participating loans, quasi-equity, royalties on IP, mezzanine debt and minority equity.","fr":"Soit une structure evergreen avec rachats semestriels, soit un fonds fermé de 7 à 10 ans. Les instruments sont les prêts participatifs, la quasi-équité, les royautés sur la PI, la dette mezzanine et l'équité minoritaire."}},{"g":"inv","c":"fund","q":{"en":"How is the manager chosen, and what is their exposure?","fr":"Comment le gestionnaire est-il choisi, et quelle est son exposition?"},"a":{"en":"By public request for proposals, with a 2–5% co-investment requirement. The manager has skin in the game and holds capital allocation; the Conseil validates opportunities but never allocates.","fr":"Par appel d'offres public, avec une exigence de co-investissement de 2 à 5 %. Le gestionnaire engage son propre argent et détient l'allocation du capital; le Comité valide les occasions mais n'alloue jamais."}},{"g":"inv","c":"office","q":{"en":"Where does the deal flow come from?","fr":"D'où vient le flux d'occasions?"},"a":{"en":"From the executive production office: 40–50 experienced producers in market producing 80–120 qualified opportunities a year, each validated by a Sage through their network within 48 hours and scored on export, viability, IP and capacity before it reaches the fund.","fr":"Du bureau de production exécutive : 40 à 50 producteurs d'expérience sur le terrain produisant 80 à 120 occasions qualifiées par année, chacune validée par un Sage par son réseau en 48 h et notée sur l'exportation, la viabilité, la PI et la capacité avant d'atteindre le fonds."}},{"g":"inv","c":"fund","q":{"en":"What about currency and political risk in the Gulf or Asia?","fr":"Et le risque de change et le risque politique dans le Golfe ou en Asie?"},"a":{"en":"Those sit with the exporter's contract and are the territory of EDC's existing products, which stack with the reserve's capital protection. The Recoupment Standard also requires contracts to separate development, exploitation and IP licence so one dispute does not sink the whole deal.","fr":"Ils relèvent du contrat de l'exportateur et des produits existants d'EDC, qui s'empilent avec la protection du capital de la réserve. Le Standard de recoupment exige aussi que les contrats séparent développement, exploitation et licence de PI pour qu'un litige ne coule pas toute l'entente."}},{"g":"prod","c":"producers","q":{"en":"Who qualifies?","fr":"Qui est admissible?"},"a":{"en":"Commercial creative content built for international markets: film and TV co-production, video games, touring live productions, immersive and experiential, audio and music, event technology. The four-question test decides: mainly domestic audience or national identity as purpose means cultural; export over 50% of revenue and sellable as-is in 10+ countries means eligible.","fr":"Du contenu créatif commercial conçu pour les marchés internationaux : coproduction ciné/télé, jeux vidéo, productions en tournée, immersif et expérientiel, audio et musique, technologie événementielle. Le test en quatre questions tranche : public surtout national ou identité nationale comme objet, c'est culturel; exportation supérieure à 50 % des revenus et vendable tel quel dans 10 pays et plus, c'est admissible."}},{"g":"prod","c":"producers","q":{"en":"Do I have to own the IP outright?","fr":"Dois-je détenir la PI en pleine propriété?"},"a":{"en":"No. The headline is 'IP stays in Canada'; the rule is that a recurring Canadian revenue right survives the contract: ownership, co-ownership, a licence, or a royalty on the work. A client can own the show and still pay a royalty per performance. Pure buy-out work with nothing flowing back qualifies for the Export Advance and qualification support only.","fr":"Non. Le titre est « la PI reste au Canada »; la règle est qu'un droit de revenu récurrent demeure au Canada après le contrat : propriété, copropriété, licence ou royauté sur l'œuvre. Un client peut détenir le spectacle et verser quand même une royauté par représentation. Le rachat complet sans retour n'a droit qu'à l'Avance Export et au soutien à la qualification."}},{"g":"prod","c":"office","q":{"en":"What does qualification cost me?","fr":"Combien me coûte la qualification?"},"a":{"en":"Nothing; it is paid by the office's operating budget. Once an opportunity is qualified, the Export Advance covers $25K–150K for the concept, the trips and the negotiation. It is repaid when the contract signs and written off as an accepted loss if a positively qualified opportunity falls through.","fr":"Rien; elle est financée par le budget de fonctionnement du bureau. Une fois l'occasion qualifiée, l'Avance Export couvre de 25 à 150 K$ pour le concept, les voyages et la négociation. Elle est remboursée à la signature du contrat et convertie en perte acceptée si une occasion qualifiée positivement tombe."}},{"g":"prod","c":"fund","q":{"en":"Will the fund take control of my company?","fr":"Le fonds prendra-t-il le contrôle de mon entreprise?"},"a":{"en":"No. The instruments are participating loans, quasi-equity, royalties, mezzanine debt and minority equity. The fund finances the export project; it does not run the studio.","fr":"Non. Les instruments sont les prêts participatifs, la quasi-équité, les royautés, la dette mezzanine et l'équité minoritaire. Le fonds finance le projet d'exportation; il ne dirige pas le studio."}},{"g":"prod","c":"standard","q":{"en":"Do the ten clauses of the Recoupment Standard make my bid less competitive?","fr":"Les dix clauses du Standard de recoupment rendent-elles mon offre moins compétitive?"},"a":{"en":"They are a guild floor: when every Canadian producer carries the same clauses, foreign counterparties learn to respect them, and the asymmetry each SME faced alone becomes a collective advantage. The office backs you in the negotiation, and the clauses are a condition only for projects financed by the fund.","fr":"C'est un plancher de guilde : quand chaque producteur canadien porte les mêmes clauses, les contreparties étrangères apprennent à les respecter, et l'asymétrie que chaque PME affrontait seule devient un avantage collectif. Le bureau vous appuie dans la négociation, et les clauses ne sont une condition que pour les projets financés par le fonds."}},{"g":"prod","c":"standard","q":{"en":"Guilds and unions: does this weaken creators' protections?","fr":"Guildes et syndicats : cela affaiblit-il la protection des créateurs?"},"a":{"en":"It strengthens them. Cultural programs and collective agreements are untouched, and the Recoupment Standard is written so that revenue actually reaches the producer, which is what makes residuals and royalty cascades to designers, composers and performers real rather than theoretical.","fr":"Il la renforce. Les programmes culturels et les conventions collectives restent intacts, et le Standard de recoupment est écrit pour que les revenus parviennent réellement au producteur, ce qui rend les résiduels et les cascades de royautés vers les concepteurs, compositeurs et interprètes réels plutôt que théoriques."}},{"g":"prod","c":"producers","q":{"en":"What happens to my tax credits?","fr":"Qu'advient-il de mes crédits d'impôt?"},"a":{"en":"They stay entirely with you. They are not a source of the fund; they are deducted from the capital request before scoring, so the fund finances only what the credits do not.","fr":"Ils restent intégralement à vous. Ils ne sont pas une source du fonds; ils sont déduits de la demande de capital avant le scoring, de sorte que le fonds ne finance que ce que les crédits ne couvrent pas."}},{"g":"prod","c":"producers","q":{"en":"Can a large company like Cirque or Ubisoft use the engine?","fr":"Une grande entreprise comme le Cirque ou Ubisoft peut-elle utiliser le moteur?"},"a":{"en":"The engine is designed for SMEs, the companies that lose $100,000 on an unqualified lead and cannot carry a franchise through development. The IP condition applies to everyone.","fr":"Le moteur est conçu pour les PME, celles qui perdent 100 000 $ sur une occasion non qualifiée et ne peuvent pas porter une franchise jusqu'au développement. La condition PI s'applique à tous."}},{"g":"prod","c":"office","q":{"en":"Does the office take a cut of my deal?","fr":"Le bureau prend-il une part de mon entente?"},"a":{"en":"The offices are seeded for 24 months and then become self-supporting by monetizing the deals they help close. The qualification itself never costs the company anything.","fr":"Les bureaux sont amorcés pendant 24 mois, puis deviennent autoportants en monétisant les ententes qu'ils aident à conclure. La qualification elle-même ne coûte jamais rien à l'entreprise."}},{"g":"prod","c":"sages","q":{"en":"I have a project, not an IP. How does the Conseil help?","fr":"J'ai un projet, pas une PI. Comment le Comité m'aide-t-il?"},"a":{"en":"Part of the Conseil's mandate is to find the IP inside a qualified opportunity, layer by layer: what can be patented (a mechanism, an automation), what is industrial design (the look of a unit), what is copyright (characters, costumes, story, music), what is a trademark, what is know-how. Then it steers the contract so those layers are separated and kept or licensed rather than swept into a buy-out. A producer sees a parade; a Sage sees five rights.","fr":"Une partie du mandat du Comité est de trouver la PI dans une occasion qualifiée, couche par couche : ce qui se brevète (un mécanisme, une automatisation), ce qui est un dessin industriel (l'allure d'une unité), ce qui est du droit d'auteur (personnages, costumes, récit, musique), ce qui est une marque, ce qui est du savoir-faire. Puis il oriente le contrat pour que ces couches soient séparées et conservées ou concédées sous licence plutôt qu'emportées dans un rachat. Un producteur voit une parade; un Sage voit cinq droits."}},{"g":"gov","c":"sages","q":{"en":"How do you manage conflicts of interest on the Conseil des Sages?","fr":"Comment gérez-vous les conflits d'intérêts au Comité des Sages?"},"a":{"en":"The Conseil validates; it never allocates capital, so no Sage can steer money to a project. Selection is on commercial and cultural merit, at arm's length from politics, and the fund manager's own capital is at risk on every allocation.","fr":"Le Comité valide; il n'alloue jamais de capital, donc aucun Sage ne peut diriger de l'argent vers un projet. La sélection se fait sur le mérite commercial et culturel, à distance du politique, et le capital propre du gestionnaire est en jeu à chaque allocation."}},{"g":"gov","c":"office","q":{"en":"Who decides eligibility, and against what grid?","fr":"Qui décide de l'admissibilité, et selon quelle grille?"},"a":{"en":"An eligibility committee at head office, on a published grid: export potential, viability, IP position and delivery capacity. The six-step pipeline runs opportunity, qualification, quantification, summary, scoring, decision, the same for PULL and PUSH.","fr":"Un comité d'admissibilité au siège, selon une grille publiée : potentiel d'exportation, viabilité, position PI et capacité de livraison. Le pipeline en six étapes enchaîne occasion, qualification, quantification, sommaire, scoring, décision, le même en PULL et en PUSH."}},{"g":"gov","c":"policy","q":{"en":"Crown corporation, program, or unit inside an existing agency?","fr":"Société d'État, programme, ou unité dans un organisme existant?"},"a":{"en":"The Quebec model is a société d'État. At the federal level the engine is deliberately presented as a mechanism, not an institution: what matters is the three separated roles, the reserve and the offices, and those can live in more than one vehicle.","fr":"Le modèle québécois est une société d'État. Au fédéral, le moteur est volontairement présenté comme un mécanisme, pas une institution : ce qui compte, ce sont les trois rôles séparés, la réserve et les bureaux, et ils peuvent loger dans plus d'un véhicule."}},{"g":"gov","c":"reserve","q":{"en":"Does this run into trade rules on subsidies (CUSMA, WTO)?","fr":"Cela heurte-t-il les règles commerciales sur les subventions (ACEUM, OMC)?"},"a":{"en":"The state insures at a priced premium; it does not grant, and the capital is private. Precedents with the same structure operate in the UK and the US.","fr":"L'État assure moyennant une prime tarifée; il ne subventionne pas, et le capital est privé. Des précédents de même structure fonctionnent au Royaume-Uni et aux États-Unis."}},{"g":"gov","c":"outcomes","q":{"en":"What are the success metrics, and when is it reviewed?","fr":"Quels sont les indicateurs de succès, et quand est-il révisé?"},"a":{"en":"Five-year targets at proof-of-concept scale: exports from 3.5 to 5.5 G$, private capital deployed $800M, jobs up 40%, Canadian-held IP from 30 to 45% of output, reserve from $50M to about $69M with net cost trending to zero.","fr":"Cibles sur cinq ans à l'échelle de la preuve de concept : exportations de 3,5 à 5,5 G$, 800 M$ de capital privé déployé, emplois en hausse de 40 %, PI canadienne de 30 à 45 % de la production, réserve de 50 M$ à environ 69 M$ avec un coût net tendant vers zéro."}},{"g":"prov","c":"outcomes","q":{"en":"Is this a Quebec project in federal clothing?","fr":"Est-ce un projet québécois déguisé en projet fédéral?"},"a":{"en":"The proof of concept is Quebec-scale because that is where the model was built and validated. Scaled federally, across all provinces and the full breadth of creative content, the figures grow accordingly.","fr":"La preuve de concept est à l'échelle du Québec parce que c'est là que le modèle a été bâti et validé. À l'échelle fédérale, toutes provinces et tout le contenu créatif confondus, les chiffres grandissent en conséquence."}},{"g":"prov","c":"policy","q":{"en":"Culture is a provincial jurisdiction. Where does the federal role stop?","fr":"La culture est de compétence provinciale. Où s'arrête le rôle fédéral?"},"a":{"en":"The engine is export and industrial policy, not cultural policy. It separates commercial creative export from cultural subsidy precisely so that provincial cultural mandates stay untouched.","fr":"Le moteur est une politique d'exportation et industrielle, pas une politique culturelle. Il sépare l'exportation créative commerciale de la subvention culturelle précisément pour que les mandats culturels provinciaux restent intacts."}},{"g":"prov","c":"policy","q":{"en":"You are also pitching this to the PLQ. Which is it?","fr":"Vous le proposez aussi au PLQ. Alors, lequel?"},"a":{"en":"The same model at two levels. A province can run it as a proof of concept; the federal version scales it and adds shared infrastructure abroad. Neither excludes the other.","fr":"Le même modèle à deux niveaux. Une province peut le faire fonctionner comme preuve de concept; la version fédérale le met à l'échelle et ajoute l'infrastructure partagée à l'étranger. Aucun n'exclut l'autre."}},{"g":"pub","c":"policy","q":{"en":"Isn't this corporate welfare for 'Hollywood North'?","fr":"N'est-ce pas de l'aide aux entreprises pour « Hollywood North »?"},"a":{"en":"It is the opposite. Hollywood North is the service model: Canadian talent on foreign-owned IP, which is what the engine stops rewarding. No public money is invested in any project; the capital is private, the condition is a lasting Canadian right to the IP, and the only public cost is a modest operating budget and a self-financing insurance reserve.","fr":"C'est le contraire. Hollywood North, c'est le modèle de services : du talent canadien sur des PI étrangères, exactement ce que le moteur cesse de récompenser. Aucun argent public n'est investi dans un projet; le capital est privé, la condition est un droit canadien durable sur la PI, et le seul coût public est un budget de fonctionnement modeste et une réserve d'assurance autofinancée."}},{"g":"pub","c":"reserve","q":{"en":"Why should taxpayers insure private investors?","fr":"Pourquoi les contribuables devraient-ils assurer des investisseurs privés?"},"a":{"en":"Because it is the cheapest way to get $800M of private money into a sector where Canada has a demonstrated comparative advantage, and it returns: the reserve grows on premiums and the net cost trends to zero. Every model where the state insured rather than invested has been neutral or positive for taxpayers.","fr":"Parce que c'est le moyen le moins coûteux d'attirer 800 M$ d'argent privé dans un secteur où le Canada détient un avantage comparatif démontré, et que ça rapporte : la réserve croît au fil des primes et le coût net tend vers zéro. Chaque modèle où l'État a assuré plutôt qu'investi a été neutre ou positif pour le contribuable."}},{"g":"pub","c":"outcomes","q":{"en":"What is the proof this works?","fr":"Quelle est la preuve que ça fonctionne?"},"a":{"en":"Canada's biggest creative export successes share one trait: a Canadian company kept the IP. PAW Patrol, $15B+ in retail sales in 170+ countries. Dead by Daylight, 70M players, a studio that grew from 300 to 1,260 employees. Cirque du Soleil, 100M+ spectators. The counter-example is just as Canadian: Quebec VFX went from 8,037 jobs to 2,603 when the service work moved.","fr":"Les plus grands succès d'exportation créative du Canada ont un point commun : une entreprise canadienne a gardé la PI. PAW Patrol, plus de 15 G$ de ventes au détail dans 170+ pays. Dead by Daylight, 70 M de joueurs, un studio passé de 300 à 1 260 employés. Cirque du Soleil, plus de 100 M de spectateurs. Le contre-exemple est tout aussi canadien : les VFX québécois sont passés de 8 037 à 2 603 emplois quand le travail à forfait est parti."}},{"g":"pub","c":"reserve","q":{"en":"What happens if it fails?","fr":"Que se passe-t-il en cas d'échec?"},"a":{"en":"The exposure is bounded by design: the reserve pays only what it holds, offices are seeded for 24 months and must become self-supporting, and the fund is private money managed by someone with their own capital at risk.","fr":"L'exposition est bornée par conception : la réserve ne paie que ce qu'elle détient, les bureaux sont amorcés pendant 24 mois et doivent devenir autoportants, et le fonds est de l'argent privé géré par quelqu'un qui engage son propre capital."}},{"g":"intl","c":"standard","q":{"en":"Foreign buyer: does this make Canadian vendors harder to contract with?","fr":"Acheteur étranger : cela rend-il les fournisseurs canadiens plus difficiles à contracter?"},"a":{"en":"It makes them safer to contract with. The Standard is a transparent floor on accounting, not on price: strict gross receipts, capped fees, audit rights, no cross-collateralization. Serious partners already accept these terms. And a vendor backed by qualified financing and a producer in your market is a vendor who delivers.","fr":"Cela les rend plus sûrs à contracter. Le Standard est un plancher transparent sur la comptabilité, pas sur le prix : recettes brutes strictes, frais plafonnés, droits d'audit, pas de cross-collateralization. Les partenaires sérieux acceptent déjà ces conditions. Et un fournisseur appuyé par un financement qualifié et un producteur sur votre marché est un fournisseur qui livre."}},{"g":"intl","c":"customers","q":{"en":"Does the Canadian government become a party to my contract?","fr":"Le gouvernement canadien devient-il partie à mon contrat?"},"a":{"en":"No. The contract is between you and the Canadian company. The reserve insures the fund's capital behind the scenes; it has no role in your agreement.","fr":"Non. Le contrat est entre vous et l'entreprise canadienne. La réserve assure le capital du fonds en coulisse; elle n'a aucun rôle dans votre entente."}},{"g":"intl","c":"outcomes","q":{"en":"Doesn't AI make all of this obsolete?","fr":"L'IA ne rend-elle pas tout cela obsolète?"},"a":{"en":"AI is why it matters. It eliminates tasks, not industries: a fifteen-person studio can now produce at a quality once reserved for the majors, which shifts value toward creative direction, IP ownership and market development, exactly what the engine finances and sells. Competing jurisdictions are already financing AI adoption; the temporary VFX recovery line ($3M a year for three years) accelerates the pivot from effects factory to IP creator.","fr":"L'IA est la raison même de son importance. Elle élimine des tâches, pas des industries : un studio de quinze personnes peut maintenant produire à une qualité autrefois réservée aux majors, ce qui déplace la valeur vers la direction créative, la propriété de la PI et le développement de marchés, exactement ce que le moteur finance et vend. Les juridictions concurrentes financent déjà l'adoption de l'IA; le poste temporaire de redressement des VFX (3 M$ par année pendant trois ans) accélère le pivot d'usine à effets vers créateur de PI."}}];
// Private notes ("to decide") and the opportunity portfolio are not in this build.
// They are loaded from /api/prep after the admin password (Shift+P).
// ---------- Portfolio v2: opportunity capture (private, prep mode) ----------
// Seven blocks: origin · customer · Canadian company · project · where is the IP · money · assessment (+ counterfactual, lessons).
// Empty string = not captured yet (rendered as "to capture").
const PF_SECTORS = {live:B("Touring / resident shows","Spectacles"), film:B("Film & TV co-production","Coproduction ciné/télé"), game:B("Video games","Jeux vidéo"), imm:B("Immersive & experiential","Immersif et expérientiel"), evt:B("Event technology","Technologie événementielle"), edu:B("Training / know-how (service)","Formation / savoir-faire (service)"), fest:B("Events & festivals","Événements et festivals")};
const PF_IPNAME = {buyout:B("Buy-out","Rachat complet"), royalty:B("Buy-out + royalties","Rachat + royautés"), shared:B("Shared IP","PI partagée"), licence:B("Licence","Licence"), own:B("Full ownership","Propriété complète"), licin:B("Foreign IP licensed in","PI étrangère sous licence")};
const PF_STAGES = ["opportunity","qualified","quantified","summary","scored","decision","contract","delivered","lost"];
const PF_STAGENAME = {opportunity:B("Opportunity","Occasion"), qualified:B("Qualified","Qualifiée"), quantified:B("Quantified","Quantifiée"), summary:B("Summary","Sommaire"), scored:B("Scored","Notée"), decision:B("Decision","Décision"), contract:B("Contract","Contrat"), delivered:B("Delivered","Livrée"), lost:B("Lost / stopped","Perdue / arrêtée")};
const PF_LAYERS = ["Patent","Industrial design","Copyright","Trademark","Trade secret / know-how","Format / contract rights"];
const IPROW = (layer, asset, ownerNow, ownerAfter, protectable, registered, territory) => ({layer, asset, ownerNow, ownerAfter, protectable, registered, territory});

let PORTFOLIO = [];
let PREP_LOADED = false;
// ---------- rendering ----------
const W=1200, Hh=760;
const viewport=document.getElementById("viewport"), world=document.getElementById("world"), flowsSvg=document.getElementById("flows"), nodesEl=document.getElementById("nodes");
const stageEl=document.getElementById("stagecard"), stageInner=document.getElementById("stageinner"), crumbsEl=document.getElementById("crumbs");
const NS="http://www.w3.org/2000/svg";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function el(n,attrs,parent){const e=document.createElementNS(NS,n);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

let state = {node:null, facet:null};
let tour = {on:false, i:0, playing:false, timer:null};

function renderFlows(){
  flowsSvg.innerHTML="";
  const defs=el("defs",{},flowsSvg);
  for (const [id,c] of [["pub","#E3A63B"],["priv","#4FB8AD"],["gov","rgba(243,237,226,.7)"]]){
    const m=el("marker",{id:"ar-"+id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},defs);
    el("path",{d:"M0,0 L10,5 L0,10 z",fill:c},m);
  }
  FLOWS.forEach((f,i)=>{
    if(!f.path) return;
    const key=f.from+">"+f.to, pid="fp"+i;
    const p=el("path",{id:pid,d:f.path,class:"flow "+f.kind+(reduce?"":" anim"),"marker-end":"url(#ar-"+f.kind+")","data-key":key},flowsSvg);
    if(!reduce){
      // money particles: count and speed scale with path length
      const len=p.getTotalLength(); const n=Math.max(2,Math.round(len/70)); const dur=(len/55).toFixed(2);
      for(let k=0;k<n;k++){
        const c=el("circle",{r:3,class:"dot "+f.kind,"data-key":key},flowsSvg);
        const am=el("animateMotion",{dur:dur+"s",begin:(-(dur*k/n)).toFixed(2)+"s",repeatCount:"indefinite",rotate:"auto"},c);
        const mp=el("mpath",{},am); mp.setAttribute("href","#"+pid); mp.setAttributeNS("http://www.w3.org/1999/xlink","xlink:href","#"+pid);
      }
    }
    const lab=T(f.l); if(!lab) return;
    el("rect",{x:f.lx-4,y:f.ly-11,width:lab.length*6.4+12,height:16,rx:4,class:"flabel-bg","data-key":key},flowsSvg);
    const t=el("text",{x:f.lx+2,y:f.ly+1,class:"flabel "+f.kind,"data-key":key},flowsSvg); t.textContent=lab;
  });
}
// light a set of flow keys (or a node's connected flows); null clears
function highlight(keys){
  if(!keys||!keys.length){ flowsSvg.classList.remove("hl"); flowsSvg.querySelectorAll(".lit").forEach(e=>e.classList.remove("lit")); return; }
  flowsSvg.classList.add("hl");
  flowsSvg.querySelectorAll("[data-key]").forEach(e=>e.classList.toggle("lit",keys.includes(e.dataset.key)));
}
const flowsOf = id => FLOWS.filter(f=>f.path&&(f.from===id||f.to===id)).map(f=>f.from+">"+f.to);
let firstRender=true;
function renderNodes(){
  nodesEl.innerHTML="";
  NODES.forEach((n,i)=>{
    const d=document.createElement("div");
    d.className="node "+n.kind+(n.small?" small":"")+(state.node===n.id?" hot":"")+(tour.on&&TOUR[tour.i].node===n.id?" focus":"")+(firstRender&&!reduce?" enter":"");
    d.style.cssText=`left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px;animation-delay:${.08*i}s`;
    d.addEventListener("mouseenter",()=>{ if(!tour.on&&!state.node) highlight(flowsOf(n.id)); });
    d.addEventListener("mouseleave",()=>{ if(!tour.on&&!state.node) highlight(null); });
    d.tabIndex=0; d.setAttribute("role","button"); d.dataset.id=n.id;
    d.innerHTML = n.small
      ? `<div class="t">${esc(T(n.t))}</div><div class="s">${esc(T(n.s))}</div>`
      : `<div class="tag">${esc(T(n.tag))}</div><div class="t">${esc(T(n.t))}</div><div class="s">${esc(T(n.s))}</div><div class="k">${esc(T(n.k))}</div>`;
    d.addEventListener("click",()=>openNode(n.id));
    d.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openNode(n.id);}});
    nodesEl.appendChild(d);
  });
  firstRender=false;
}

// ---------- camera ----------
let cam={s:1,tx:0,ty:0};
function fitCamera(){
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  const s=Math.min(vw/W, vh/Hh);
  cam={s, tx:(vw-W*s)/2, ty:(vh-Hh*s)/2};
  applyCam();
}
function flyTo(n){
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  const fit=Math.min(vw/W, vh/Hh);
  const s=fit*1.55;
  const cx=n.x+n.w/2, cy=n.y+n.h/2;
  cam={s, tx:vw/2-cx*s, ty:vh/2-cy*s};
  applyCam();
}
// tour framing: moderate zoom, node sits in the upper 40% so the caption never covers it
function flyToTour(n){
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  const fit=Math.min(vw/W, vh/Hh);
  const s=fit*1.28;
  const cx=n.x+n.w/2, cy=n.y+n.h/2;
  const capH=Math.min(240, vh*.42);
  cam={s, tx:vw/2-cx*s, ty:(vh-capH)/2-cy*s};
  applyCam();
}
function applyCam(){ world.style.transform=`translate(${cam.tx}px,${cam.ty}px) scale(${cam.s})`; }
function nodeScreenRect(n){ return {left:cam.tx+n.x*cam.s, top:cam.ty+n.y*cam.s, width:n.w*cam.s, height:n.h*cam.s}; }
function stageTargetRect(){
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  const w=Math.min(vw-16, 1120), h=Math.min(vh-16, 760);
  return {left:(vw-w)/2, top:(vh-h)/2, width:w, height:h};
}
function setRect(r){ stageEl.style.left=r.left+"px"; stageEl.style.top=r.top+"px"; stageEl.style.width=r.width+"px"; stageEl.style.height=r.height+"px"; }

// ---------- levels ----------
function openNode(id){
  if(snapState.on) closeSnap();
  if(pfState.on) closePF();
  if(qaState.on) closeQA();
  if(tour.on) pauseTour();
  highlight(null);
  const n=NODES.find(x=>x.id===id); state={node:id,facet:null};
  // start the card at the node's current screen rect, then fly
  const from=nodeScreenRect(n);
  stageEl.className="stage "+n.kind; stageEl.hidden=false; setRect(from);
  stageEl.style.opacity="1";
  renderStage(n);
  nodesEl.querySelectorAll(".node").forEach(d=>d.classList.toggle("hot",d.dataset.id===id));
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    world.classList.add("away"); flyTo(n); setRect(stageTargetRect()); stageEl.classList.add("open");
  }));
  renderCrumbs();
}
function closeAll(){
  const n=NODES.find(x=>x.id===state.node); if(!n){return;}
  state={node:null,facet:null};
  stageEl.classList.remove("open");
  world.classList.remove("away");
  if(tour.on){ showStep(tour.i,false); } else fitCamera();
  nodesEl.querySelectorAll(".node").forEach(d=>d.classList.remove("hot"));
  // shrink back to the node's (new) rect, then hide
  requestAnimationFrame(()=>{ setRect(nodeScreenRect(n)); stageEl.style.opacity="0"; });
  setTimeout(()=>{ stageEl.hidden=true; stageEl.style.opacity="1"; }, reduce?0:900);
  renderCrumbs();
}
function renderStage(n){
  stageInner.innerHTML = `
    <div class="shead">
      <div>
        <p class="tag">${esc(T(n.tag))||"&nbsp;"}</p>
        <h2>${esc(T(n.t))}</h2>
        <div class="k">${esc(T(n.k))||esc(T(n.s))}</div>
      </div>
      <div class="sactions">
        <button class="ibtn" type="button" id="backbtn" hidden>← ${UI[LANG].back}</button>
        <button class="ibtn" type="button" onclick="openQAFor('${n.id}')">${UI[LANG].qa}</button>
        <button class="ibtn round" type="button" aria-label="${UI[LANG].close}" onclick="closeAll()">×</button>
      </div>
    </div>
    <div class="sbody" id="sbody"></div>`;
  document.getElementById("backbtn").addEventListener("click",()=>backToTiles());
  renderTiles(n);
}
function firstText(f){ const b=f.body.find(x=>x.t==="p"); return b? T(b) : ""; }
function renderTiles(n){
  const sb=document.getElementById("sbody");
  sb.innerHTML = `<p class="intro">${esc(firstText(n.facets[0]))}</p><div class="tiles">`+n.facets.map((f,i)=>{
    const hint=firstText(f); const short = hint.length>110 ? hint.slice(0,107).replace(/\s+\S*$/,"")+"…" : hint;
    return `<button class="tile" type="button" data-f="${f.id}"><span class="num">0${i+1}</span><span class="big">${esc(T(f.n))}</span><span class="hint">${esc(short)}</span><span class="go">→</span></button>`;
  }).join("")+`</div>`;
  sb.querySelectorAll(".tile").forEach(t=>t.addEventListener("click",()=>openFacet(t.dataset.f, t)));
  document.getElementById("backbtn").hidden=true;
}
function openFacet(fid, fromTile){
  const n=NODES.find(x=>x.id===state.node), f=n.facets.find(x=>x.id===fid); state.facet=fid;
  const sb=document.getElementById("sbody");
  // origin of the grow animation = the tile that was clicked
  let ox="50%", oy="50%";
  if(fromTile){ const r=fromTile.getBoundingClientRect(), s=sb.getBoundingClientRect(); ox=((r.left+r.width/2-s.left)/s.width*100)+"%"; oy=((r.top+r.height/2-s.top)/s.height*100)+"%"; }
  sb.innerHTML = `<div class="detail" style="--ox:${ox};--oy:${oy}">
      <div class="tabs">${n.facets.map(x=>`<button class="tab" type="button" data-f="${x.id}" ${x.id===fid?'aria-current="true"':''}>${esc(T(x.n))}</button>`).join("")}</div>
      <div class="dcontent"><h2>${esc(T(f.n))}</h2>${f.body.map(renderBlock).join("")}</div>
    </div>`;
  sb.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{ if(t.dataset.f!==state.facet) openFacet(t.dataset.f); }));
  document.getElementById("backbtn").hidden=false;
  renderCrumbs();
}
function backToTiles(){
  const n=NODES.find(x=>x.id===state.node); const d=document.querySelector(".detail");
  state.facet=null;
  if(d && !reduce){ d.classList.add("leaving"); setTimeout(()=>renderTiles(n),330);} else renderTiles(n);
  renderCrumbs();
}

  if(!state.node) fitCamera();
}
function pauseTour(){ tour.playing=false; clearTimeout(tour.timer); capEl.classList.remove("show"); }
function showStep(i,resetTimer){
  tour.i=i; const st=TOUR[i], n=NODES.find(x=>x.id===st.node);
  nodesEl.querySelectorAll(".node").forEach(d=>d.classList.toggle("focus",d.dataset.id===st.node));
  flyToTour(n);
  highlight(st.flows.length?st.flows:flowsOf(st.node));
  const u=UI[LANG], last=i===TOUR.length-1;
  capEl.className="caption show "+n.kind;
  capEl.innerHTML=`<div class="cbody">
    <div class="ctop"><span class="step">${u.step} ${i+1} ${u.of} ${TOUR.length} · ${esc(T(n.t))}</span>
      <span class="dots">${TOUR.map((_,k)=>`<i class="${k<i?'done':k===i?'cur':''}" data-k="${k}" title="${u.step} ${k+1}"></i>`).join("")}</span></div>
    <h3>${esc(T(st.h))}</h3><p>${esc(T(st.p))}</p>
    <div class="cbar">
      <button class="ibtn" type="button" id="tprev" ${i===0?'disabled':''}>← <span class="lbl">${u.prev}</span></button>
      <button class="ibtn" type="button" id="tplay" aria-label="${tour.playing?u.pause:u.play}">${tour.playing?'❚❚':'▶'}</button>
      <button class="ibtn primary" type="button" id="tnext"><span class="lbl">${last?u.finish:u.next}</span> ${last?'✓':'→'}</button>
      <button class="ibtn explore" type="button" id="texplore">${u.explore} ↗</button>
    </div></div>
    <div class="prog"><i id="tprog"></i></div>`;
  capEl.querySelector("#tprev").onclick=()=>go(i-1);
  capEl.querySelector("#tnext").onclick=()=>last?endTour():go(i+1);
  capEl.querySelector("#tplay").onclick=()=>{ tour.playing=!tour.playing; showStep(i,true); };
  capEl.querySelector("#texplore").onclick=()=>openNode(st.node);
  capEl.querySelectorAll(".dots i").forEach(d=>d.onclick=()=>go(+d.dataset.k));
  clearTimeout(tour.timer);
  const pr=capEl.querySelector("#tprog");
  if(tour.playing && !last){
    pr.style.transitionDuration=TOUR_STEP_MS+"ms";
    requestAnimationFrame(()=>requestAnimationFrame(()=>pr.classList.add("run")));
    tour.timer=setTimeout(()=>go(i+1),TOUR_STEP_MS);
  } else if(tour.playing && last){
    pr.style.transitionDuration="0ms"; pr.classList.add("run");
  }
}
function go(i){ if(i<0||i>=TOUR.length) return; showStep(i,true); }

document.addEventListener("keydown",e=>{
  if(e.key==="P" && e.shiftKey && !e.metaKey && !e.ctrlKey && !(e.target && /input|textarea/i.test(e.target.tagName))){ e.preventDefault(); togglePrep(); if(!qaState.on && qaState.prep) openQA(); return; }
  if(e.key==="Escape"){ if(!document.getElementById("prepask").hidden){ document.getElementById("prepask").hidden=true; } else if(fbState.on){ closeFB(); } else if(snapState.on){ closeSnap(); } else if(pfState.on){ if(pfState.open){pfState.open=null; renderPF();} else closePF(); } else if(qaState.on) closeQA(); else if(state.facet) backToTiles(); else if(state.node) closeAll(); else if(tour.on) endTour(); }
  if(tour.on && !state.node){ if(e.key==="ArrowRight") go(tour.i+1); if(e.key==="ArrowLeft") go(tour.i-1); if(e.key===" "){ e.preventDefault(); tour.playing=!tour.playing; showStep(tour.i,true); } }
});
window.addEventListener("resize",()=>{ if(state.node){ const n=NODES.find(x=>x.id===state.node); flyTo(n); setRect(stageTargetRect()); } else if(tour.on){ flyToTour(NODES.find(x=>x.id===TOUR[tour.i].node)); } else fitCamera(); });

 fr:{
  why:{h:"Pourquoi un nouveau mécanisme — trois questions d'abord", qs:[
    {b:"Pourquoi les institutions existantes ne suffisent-elles pas?",s:"Elles interviennent toutes une fois l'œuvre produite ou le contrat signé. Le soutien à la production (crédits d'impôt, Téléfilm, le FMC) finance la fabrication de l'œuvre pour le marché national; Exportation créative Canada paie des activités d'exportation sous forme de subventions; Exportation et développement Canada assure et finance des transactions quand l'exportateur a déjà un contrat, des comptes clients et un bilan. Personne ne finance l'étape entre les deux — transformer une occasion internationale qualifiée en contrat signé avec un droit canadien attaché — et personne n'impose de conditions à ce contrat."},
    {b:"Quel vide le moteur comble-t-il?",s:"Du capital de risque avant le contrat, protégé par une réserve publique plutôt que par le bilan de l'exportateur; des producteurs qui qualifient les occasions en quelques jours; et un standard contractuel que personne d'autre ne peut imposer, parce que personne d'autre n'est à la table quand le contrat s'écrit."},

    p:["En une ligne : un véhicule de financement, alimenté par un bureau d'exportation, conditionné par une seule règle de PI. L'argent est le moteur; le bureau est la voie d'accès; la règle de PI est le prix d'entrée."]},

  problem:{h:"Le problème", p:["Le Canada produit; d'autres possèdent. La production est bien soutenue au pays — crédits d'impôt, engagement du 3 juin 2026. Ce qui manque, c'est l'étape d'après : de 12 à 18 mois entre le premier contact et un contrat international signé, des occasions non qualifiées qui coûtent jusqu'à 100 000 $ chacune à un petit studio, et aucun capital pour développer et détenir une franchise.","Résultat : le talent canadien travaille à forfait sur des PI étrangères, et le catalogue, la franchise et la marge d'exportation s'accumulent à l'étranger."]},

    {k:"gov",b:"Comité des Sages",s:"Sept à neuf vétérans de l'industrie valident ce que le bureau a qualifié — par leur réseau, en 48 h. Ils valident; ils n'allouent jamais."},

    {k:"pub",b:"Réserve d'assurance publique",s:"Une provision unique de 50 M$ qui protège de 60 à 100 % du capital du fonds selon le palier de risque du projet. L'État n'investit jamais dans un projet; il assure le capital privé qui le fait."}],
    p:["Ordre des opérations : le bureau qualifie → le Comité valide → le gestionnaire du fonds décide."]},
  money:{h:"L'argent, en une boucle", loop:[["priv","Investisseurs"],["priv","Fonds"],["gov","Projets"],["gov","Revenus d'exportation"],["priv","Capital + rendement remboursés — puis le fonds se retire"]],
    p:["Chaque projet financé verse une prime de 3 à 12 % : environ 60 % financent le rendement assuré des investisseurs, environ 40 % vont à la réserve. La réserve paie quand un projet échoue; le reste du temps elle croît au fil des primes, et son coût net tend vers zéro.","Ni subvention, ni programme d'aide, ni accélérateur, ni capital de risque : aucun argent public n'est dépensé dans les projets, et le fonds ne prend aucune action — il est remboursé en premier, avec son rendement, puis se retire. L'entreprise garde 100 % de sa PI et de son capital-actions."]},

  owner:{h:"Qui en serait responsable", p:["Un instrument fédéral, proposé au ministre de l'Identité et de la Culture canadiennes et à Patrimoine canadien comme couche ajoutée à l'engagement du 3 juin 2026 — jamais un remplacement. Les programmes culturels et crédits d'impôt fédéraux et provinciaux restent intacts; les agences provinciales deviennent des sources qualifiées d'occasions pour le bureau.","Le bureau et le Comité opèrent à distance du politique; le fonds est privé. Reste à trancher avec le gouvernement : le véhicule juridique (société d'État, programme ou unité) et le lieu de la réserve (EDC, Finances ou nouveau véhicule)."]},
  risk:{h:"Où est le risque", risks:[
    {b:"Pour les investisseurs",s:"L'échec d'un projet — plafonné par la couverture de la réserve (60 à 100 % selon le palier) et par les dix clauses du Standard de recoupment : recettes brutes strictes, frais plafonnés, droits d'audit complets, pas de cross-collateralization."},
    {b:"Pour la réserve",s:"Des réclamations qui dépassent les primes dans une mauvaise année. Trois freins : la tarification par palier, l'argent du gestionnaire dans le fonds et la validation du Comité. L'ordre du stop-loss est un point ouvert."},
    {b:"Pour la PME",s:"Presque aucun : la qualification est payée par le bureau, l'avance n'est remboursable qu'à la signature, le capital est protégé. L'obligation est contractuelle — le Standard de recoupment et le droit qui survit."},
    {b:"Pour le gouvernement",s:"Le coût de fonctionnement du bureau — un plafond à optimiser en partageant les locaux des ambassades et bureaux commerciaux du Canada — et la mise unique de la réserve."}]},
  one:{h:"En une phrase", big:"Un moteur de financement à l'exportation pour le contenu créatif canadien, où l'État assure, l'argent privé investit, des producteurs trouvent les contrats, et la PI — ou un droit durable sur ses revenus — reste au Canada."}
 }
};
const snapEl=document.getElementById("snap"), snapInner=document.getElementById("snapinner");
let snapState={on:false};
function toggleSnap(){ snapState.on ? closeSnap() : openSnap(); }
function openSnap(){
  if(typeof fbState!=="undefined" && fbState.on) closeFB();
  if(pfState.on) closePF();
  if(qaState.on) closeQA();
  if(state.node) closeAll();
  if(tour.on) pauseTour();
  snapState.on=true; snapEl.hidden=false; world.classList.add("away");
  document.getElementById("snapbtn").classList.add("on");
  renderSnap(); const b=snapInner.querySelector(".snapbody"); if(b) b.scrollTop=0;
}
function closeSnap(){
  snapState.on=false; snapEl.hidden=true;
  document.getElementById("snapbtn").classList.remove("on");
  if(!state.node && !qaState.on && !pfState.on){ world.classList.remove("away"); if(tour.on) showStep(tour.i,false); }
}
function renderSnap(){
  const u=UI[LANG], d=SNAP[LANG]; let i=0;
  const sec=(x,inner)=>`<section class="sec"><span class="n">${++i}</span><h3>${esc(x.h)}</h3>${inner}</section>`;
  const ps=x=>(x.p||[]).map(p=>`<p>${esc(p)}</p>`).join("");
  const tbl=(x,cmp)=>`<div class="tblwrap"><table class="tbl${cmp?' cmp':''}"><thead><tr>${x.cols.map((c,k)=>`<th class="${cmp&&k===x.cols.length-1?'us':''}">${esc(c)}</th>`).join("")}</tr></thead><tbody>${x.rows.map(r=>`<tr>${r.map((c,k)=>`<td class="${cmp&&k===r.length-1?'us':''}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  snapInner.innerHTML=`<div class="qahead"><div><p class="tag" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 6px">${u.snap_eyebrow}</p>
      <h2>${u.snap_title}</h2><p>${u.snap_sub}</p></div>
      <div class="sactions"><button class="ibtn round" type="button" aria-label="${u.close}" onclick="closeSnap()">×</button></div></div>
    <div class="snapbody"><div class="snapgrid">
      ${sec(d.why, `<div class="qs">${d.why.qs.map(q=>`<div class="q"><b>${esc(q.b)}</b><span>${esc(q.s)}</span></div>`).join("")}</div>`+ps(d.why))}
      ${sec(d.who, ps(d.who))}
      ${sec(d.problem, ps(d.problem))}
      ${sec(d.what, `<div class="pieces">${d.what.pieces.map(p=>`<div class="piece ${p.k}"><b>${esc(p.b)}</b><span>${esc(p.s)}</span></div>`).join("")}</div>`+ps(d.what))}
      ${sec(d.money, `<div class="loop">${d.money.loop.map((l,k)=>`${k?'<i>→</i>':''}<span class="${l[0]}">${esc(l[1])}</span>`).join("")}</div>`+ps(d.money))}
      ${sec(d.cond, `<div class="big">${esc(d.cond.big)}</div>`+ps(d.cond))}
      ${sec(d.ex, `<div class="tblwrap"><table class="tbl"><thead><tr>${d.ex.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${d.ex.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`+ps(d.ex)+`<div class="snapcta"><button class="ibtn" type="button" onclick="closeSnap();openNode('producers');setTimeout(()=>openFacet('examples'),700)">${u.snap_examples} ↗</button></div>`)}
      ${sec(d.edc, tbl(d.edc,true)+ps(d.edc))}
      ${sec(d.sector, tbl(d.sector,false)+ps(d.sector))}
      ${sec(d.owner, ps(d.owner))}
      ${sec(d.risk, `<div class="risks">${d.risk.risks.map(r=>`<div><b>${esc(r.b)}</b>${esc(r.s)}</div>`).join("")}</div>`)}
      ${sec(d.one, `<div class="big">${esc(d.one.big)}</div>`)}
      <div class="snapcta"><button class="ibtn primary" type="button" onclick="closeSnap();startTour()">▶ ${u.snap_tour}</button><button class="ibtn" type="button" onclick="closeSnap()">${u.snap_explore} →</button><button class="ibtn" type="button" onclick="closeSnap();openQA()">${u.snap_qa}</button><button class="ibtn" type="button" onclick="closeSnap();openFB()">${u.fb}</button><a class="ibtn opbtn" href="/opportunity.html" style="text-decoration:none">${u.op} ↗</a></div>
      <p class="snapfoot">${u.snap_foot}</p>
    </div></div>`;
}

// ---------- language ----------
function applyUI(){
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=UI[LANG][e.dataset.i18n]);
  document.getElementById("lang-en").setAttribute("aria-pressed",LANG==="en");
  document.getElementById("lang-fr").setAttribute("aria-pressed",LANG==="fr");
  document.documentElement.lang = LANG==="fr" ? "fr-CA" : "en-CA";
  document.getElementById("tourlbl").textContent = tour.on ? UI[LANG].tour_exit : UI[LANG].tour;
  document.getElementById("qalbl").textContent = UI[LANG].qa;
  document.getElementById("snaplbl").textContent = UI[LANG].snap;
  document.getElementById("pflbl").textContent = UI[LANG].pf;
  document.getElementById("fblbl").textContent = UI[LANG].fb;
  document.getElementById("oplbl").textContent = UI[LANG].op; document.getElementById("opbtn").href = "/opportunity.html?lang=" + LANG;
  document.getElementById("pfbtn").hidden = !qaState.prep;
}
function setLang(l){
  LANG=l; try{localStorage.setItem("cee-lang",l);}catch(e){}
  applyUI(); renderFlows(); renderNodes();
  if(state.node){ const n=NODES.find(x=>x.id===state.node); renderStage(n); if(state.facet) openFacet(state.facet); }
  else if(tour.on){ showStep(tour.i,true); }
  if(qaState.on) renderQA();
  if(pfState.on) renderPF();
  if(fbState.on) renderFB();
  if(snapState.on) renderSnap();
  renderCrumbs();
}
applyUI(); renderFlows(); renderNodes(); fitCamera(); renderCrumbs();
fetch("/api/ping",{method:"POST"}).then(r=>r.ok?r.json():null).then(d=>{ if(d&&d.name){ const w=document.getElementById("who"); w.textContent=d.name; w.hidden=false; } }).catch(()=>{});
try{ if(localStorage.getItem("cee-prep")==="1"){ loadPrep().then(ok=>{ if(ok) setPrep(true); else localStorage.setItem("cee-prep","0"); }); } }catch(e){}
openSnap();
if(!reduce){ flowsSvg.classList.add("enter"); setTimeout(()=>flowsSvg.classList.remove("enter"),2600); }
</script>
