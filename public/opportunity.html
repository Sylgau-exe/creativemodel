<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Creative Export Engine — propose a project</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{--ink:#0B1826;--ink-2:#12283C;--line:#2B4C69;--ivory:#F3EDE2;--muted:#9FB3C4;--dim:#6B8194;--gold:#E3A63B;--gold-2:#F5C96B;--teal:#4FB8AD;--teal-2:#8BD9D0;
    --display:"Fraunces",Georgia,serif;--body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;background:var(--ink);color:var(--ivory);font-family:var(--body);font-size:15px;line-height:1.5;padding:24px 16px 60px;
    background-image:radial-gradient(700px 600px at 20% 10%,rgba(227,166,59,.14),transparent 60%),radial-gradient(800px 700px at 100% 100%,rgba(79,184,173,.12),transparent 60%)}
  .card{width:min(100%,760px);margin:0 auto;background:linear-gradient(165deg,#1B3D5A,#102539);border:1px solid rgba(227,166,59,.5);border-radius:22px;padding:28px 28px 24px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,32px);line-height:1.05;margin:0 0 10px;letter-spacing:-.01em}
  p.lead{color:var(--muted);margin:0 0 22px;font-size:14px;max-width:64ch}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--ink-2);flex:none}
  .lang button{background:none;border:0;color:var(--muted);font:600 12px/1 var(--body);letter-spacing:.08em;padding:9px 14px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
  form{display:flex;flex-direction:column;gap:14px}
  label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
  input,select,textarea{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;color:var(--ivory);font:500 15px/1.3 var(--body);padding:11px 14px;width:100%}
  textarea{font-weight:400;resize:vertical;min-height:92px}
  select option{background:#12283C}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-2);outline-offset:1px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media (max-width:560px){.row,.row3{grid-template-columns:1fr}}
  h2{font-family:var(--display);font-weight:700;font-size:17px;margin:12px 0 -4px;color:var(--gold-2)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips label{flex-direction:row;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;color:var(--ivory);font-weight:500}
  .chips input{width:auto;margin:0;accent-color:var(--gold)}
  .chips label:has(input:checked){border-color:var(--gold);background:rgba(227,166,59,.14)}
  .check{flex-direction:row;align-items:center;gap:10px;color:var(--ivory)} .check input{width:auto;accent-color:var(--gold)}
  button.go{margin-top:6px;background:var(--gold);color:var(--ink);border:0;border-radius:999px;padding:14px 18px;font:600 15px/1 var(--body);cursor:pointer;align-self:flex-start}
  button.go:hover{background:var(--gold-2)} button.go:disabled{opacity:.6;cursor:wait}
  .err{color:#F0A0A0;font-size:13px;margin:0;min-height:1.2em}
  .fine{color:var(--dim);font-size:12px;margin:18px 0 0}
  .done{display:none} .done p{color:#DDE5EC}
  a.back{color:var(--teal-2);font-size:14px}
  .hint{color:var(--dim);font-weight:400;font-size:12px}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <div><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="title"></h1></div>
    <div class="lang" role="group" aria-label="Language"><button id="lang-en" type="button" aria-pressed="true">EN</button><button id="lang-fr" type="button" aria-pressed="false">FR</button></div>
  </div>
  <p class="lead" data-i18n="lead"></p>
  <form id="f" autocomplete="on" novalidate>
    <h2 data-i18n="h_project"></h2>
    <label><span data-i18n="ftitle"></span><input name="title" required maxlength="200"></label>
    <div class="row">
      <label><span data-i18n="company"></span><input name="company" maxlength="200" autocomplete="organization"></label>
      <label><span data-i18n="role"></span><input name="role" maxlength="200" autocomplete="organization-title"></label>
    </div>
    <div class="row">
      <label><span data-i18n="sector"></span><select name="sector"><option value="">—</option><option value="live" data-i18n="s_live"></option><option value="film" data-i18n="s_film"></option><option value="game" data-i18n="s_game"></option><option value="imm" data-i18n="s_imm"></option><option value="evt" data-i18n="s_evt"></option><option value="other" data-i18n="s_other"></option></select></label>
      <label><span data-i18n="stage"></span><select name="stage"><option value="">—</option><option value="idea" data-i18n="st_idea"></option><option value="discussion" data-i18n="st_disc"></option><option value="live" data-i18n="st_live"></option></select></label>
    </div>
    <label><span data-i18n="description"></span><textarea name="description" required maxlength="4000" rows="4"></textarea></label>

    <h2 data-i18n="h_market"></h2>
    <label><span data-i18n="mode"></span><span class="chips"><label><input type="radio" name="mode" value="push"><span data-i18n="m_push"></span></label><label><input type="radio" name="mode" value="pull"><span data-i18n="m_pull"></span></label><label><input type="radio" name="mode" value="unsure"><span data-i18n="m_unsure"></span></label></span></label>
    <label><span data-i18n="customer"></span><input name="customer" maxlength="400"></label>
    <div class="row">
      <label><span data-i18n="size"></span><input name="size" maxlength="200"></label>
      <label><span data-i18n="timing"></span><input name="timing" maxlength="200"></label>
    </div>

    <h2 data-i18n="h_ip"></h2>
    <label><span data-i18n="ip"></span><select name="ip"><option value="">—</option><option value="own" data-i18n="ip_own"></option><option value="shared" data-i18n="ip_shared"></option><option value="licence" data-i18n="ip_licence"></option><option value="royalty" data-i18n="ip_royalty"></option><option value="buyout" data-i18n="ip_buyout"></option><option value="unclear" data-i18n="ip_unclear"></option></select></label>
    <label><span data-i18n="needs"></span><span class="chips"><label><input type="checkbox" name="needs" value="qualify"><span data-i18n="n_qualify"></span></label><label><input type="checkbox" name="needs" value="advance"><span data-i18n="n_advance"></span></label><label><input type="checkbox" name="needs" value="capital"><span data-i18n="n_capital"></span></label><label><input type="checkbox" name="needs" value="contract"><span data-i18n="n_contract"></span></label><label><input type="checkbox" name="needs" value="intro"><span data-i18n="n_intro"></span></label></span></label>
    <label><span data-i18n="more"></span><textarea name="more" maxlength="4000" rows="3"></textarea></label>
    <div class="row">
      <label><span data-i18n="phone"></span><input name="phone" maxlength="60" autocomplete="tel" inputmode="tel"></label>
      <label class="check" style="align-self:end"><input type="checkbox" name="contact_ok" checked><span data-i18n="contact_ok"></span></label>
    </div>
    <p class="err" id="err" aria-live="polite"></p>
    <button class="go" type="submit" id="go" data-i18n="go"></button>
  </form>
  <div class="done" id="done"><p data-i18n="done"></p><a class="back" href="/" data-i18n="back"></a></div>
  <p class="fine"><a class="back" href="/" data-i18n="back"></a> · <span data-i18n="fine"></span></p>
</main>
<script>
const UI={
  en:{eyebrow:"Private preview · a first look", title:"Propose a project", lead:"This is not an application. It is a first look at an export opportunity — live, in discussion, or still an idea — so we can see whether it fits the engine. If it does, we build the full opportunity assessment together. Ten short fields; two minutes.",
      h_project:"The project", ftitle:"Title or working name", company:"Company", role:"Your role", sector:"Sector", stage:"Stage",
      s_live:"Touring / live show", s_film:"Film & TV", s_game:"Video game", s_imm:"Immersive / experiential", s_evt:"Event technology", s_other:"Other creative content",
      st_idea:"Idea", st_disc:"In discussion", st_live:"Live — contract or production under way",
      description:"What is it? (deliverable, format, story world — a few lines)",
      h_market:"Market", mode:"How did it start?", m_push:"Push — our own idea, we seek buyers", m_pull:"Pull — a customer asked us (RFP, brief)", m_unsure:"Not sure",
      customer:"Customer or target market (who buys, where)", size:"Size (budget or revenue, rough)", timing:"Timing (decision date, delivery, season)",
      h_ip:"IP and what you need", ip:"Where would the IP sit after the contract?", ip_own:"We own it", ip_shared:"Shared / co-owned", ip_licence:"Licensed to the buyer", ip_royalty:"Buyer owns it, we keep a royalty", ip_buyout:"Full buy-out (service)", ip_unclear:"Not decided yet",
      needs:"What would the engine change for you?", n_qualify:"Qualify the opportunity", n_advance:"Export Advance (concept, trips, negotiation)", n_capital:"Protected capital", n_contract:"Contract help (Recoupment Standard)", n_intro:"An introduction to the buyer",
      more:"Anything else (risks, partners, what you have already)", phone:"Phone (optional)", contact_ok:"You may contact me about this project",
      go:"Send the sheet", done:"Thank you — the sheet is recorded. If the project fits, we will come back to you to build the full opportunity assessment together.", back:"Back to the model",
      fine:"Your sheet stays with Sylvain Gauthier and is not shared with anyone without asking you first.",
      e_fields:"A title and a short description are needed.", e_net:"Could not send. Please try again."},
  fr:{eyebrow:"Aperçu privé · un premier regard", title:"Proposer un projet", lead:"Ce n'est pas une demande. C'est un premier regard sur une occasion d'exportation — en cours, en discussion ou encore une idée — pour voir si elle correspond au moteur. Si oui, nous bâtissons ensemble l'évaluation complète de l'occasion. Dix champs courts; deux minutes.",
      h_project:"Le projet", ftitle:"Titre ou nom de travail", company:"Entreprise", role:"Votre rôle", sector:"Secteur", stage:"Étape",
      s_live:"Tournée / spectacle", s_film:"Cinéma et télé", s_game:"Jeu vidéo", s_imm:"Immersif / expérientiel", s_evt:"Technologie événementielle", s_other:"Autre contenu créatif",
      st_idea:"Idée", st_disc:"En discussion", st_live:"En cours — contrat ou production lancés",
      description:"De quoi s'agit-il? (livrable, format, univers — quelques lignes)",
      h_market:"Marché", mode:"Comment est-ce né?", m_push:"Push — notre idée, on cherche des acheteurs", m_pull:"Pull — un client nous l'a demandé (appel d'offres, brief)", m_unsure:"Pas certain",
      customer:"Client ou marché visé (qui achète, où)", size:"Taille (budget ou revenus, approximatif)", timing:"Échéancier (date de décision, livraison, saison)",
      h_ip:"PI et besoins", ip:"Où serait la PI après le contrat?", ip_own:"Nous la détenons", ip_shared:"Partagée / codétenue", ip_licence:"Sous licence à l'acheteur", ip_royalty:"L'acheteur la détient, nous gardons une royauté", ip_buyout:"Rachat complet (service)", ip_unclear:"Pas encore décidé",
      needs:"Que changerait le moteur pour vous?", n_qualify:"Qualifier l'occasion", n_advance:"Avance Export (concept, voyages, négociation)", n_capital:"Capital protégé", n_contract:"Aide au contrat (Standard de recoupment)", n_intro:"Une introduction auprès de l'acheteur",
      more:"Autre chose (risques, partenaires, ce que vous avez déjà)", phone:"Téléphone (facultatif)", contact_ok:"Vous pouvez me contacter au sujet de ce projet",
      go:"Envoyer la fiche", done:"Merci — la fiche est enregistrée. Si le projet correspond, nous reviendrons vers vous pour bâtir ensemble l'évaluation complète de l'occasion.", back:"Retour au modèle",
      fine:"Votre fiche reste entre les mains de Sylvain Gauthier et n'est partagée avec personne sans vous le demander d'abord.",
      e_fields:"Un titre et une courte description sont nécessaires.", e_net:"Envoi impossible. Veuillez réessayer."}
};
let LANG="en";
try{ const q=new URLSearchParams(location.search).get("lang"), st=localStorage.getItem("cee-lang");
  LANG = q==="fr"?"fr" : q==="en"?"en" : st==="fr"?"fr" : st==="en"?"en" : (navigator.language||"").toLowerCase().startsWith("fr")?"fr":"en"; }catch(e){}
function apply(){ document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=UI[LANG][e.dataset.i18n]); document.documentElement.lang=LANG==="fr"?"fr-CA":"en-CA"; document.title=(LANG==="fr"?"Moteur d'exportation créatif — proposer un projet":"Creative Export Engine — propose a project");
  document.getElementById("lang-en").setAttribute("aria-pressed",LANG==="en"); document.getElementById("lang-fr").setAttribute("aria-pressed",LANG==="fr"); }
document.getElementById("lang-en").onclick=()=>{LANG="en";try{localStorage.setItem("cee-lang","en")}catch(e){};apply();};
document.getElementById("lang-fr").onclick=()=>{LANG="fr";try{localStorage.setItem("cee-lang","fr")}catch(e){};apply();};
apply();
const f=document.getElementById("f"), err=document.getElementById("err"), go=document.getElementById("go"), done=document.getElementById("done");
f.addEventListener("submit", async (ev)=>{
  ev.preventDefault(); err.textContent="";
  const fd=new FormData(f);
  const d={lang:LANG, needs:fd.getAll("needs"), contact_ok:f.contact_ok.checked};
  for(const k of ["title","company","role","sector","stage","description","mode","customer","size","timing","ip","more","phone"]) d[k]=(fd.get(k)||"").toString().trim();
  if(!d.title || !d.description){ err.textContent=UI[LANG].e_fields; return; }
  go.disabled=true;
  try{
    const r=await fetch("/api/opportunity",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
    if(r.status===401){ location.replace("/gate.html?next="+encodeURIComponent("/opportunity.html")); return; }
    if(r.ok){ f.style.display="none"; done.style.display="block"; window.scrollTo(0,0); return; }
    const j=await r.json().catch(()=>({}));
    err.textContent = j.error==="fields" ? UI[LANG].e_fields : UI[LANG].e_net;
  }catch(e){ err.textContent=UI[LANG].e_net; }
  go.disabled=false;
});
</script>
</body>
</html>
